<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;font-size:14px;background:#EEEEF8}
.app{display:flex;min-height:100vh}
.sb{width:224px;background:#0F1729;color:#fff;display:flex;flex-direction:column;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-logo{font-size:15px;font-weight:700;color:#FF4C4C}
.sb-sub{font-size:10px;color:#374151;margin-bottom:14px;margin-top:1px}
.rtog{display:flex;background:#060D1A;border-radius:8px;padding:3px;gap:3px;margin-bottom:10px}

.nbtn{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border:none;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:13px;text-align:left;background:transparent;color:#9CA3AF;font-weight:500}
.nbtn.on{background:#FF4C4C18;color:#FF4C4C;font-weight:700}
.sbu{background:#060D1A;border-radius:10px;padding:10px 12px;margin-top:auto}
.main{flex:1;padding:20px;min-width:0;overflow-y:auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:8px}
.ph-t{font-size:20px;font-weight:700;color:#111827}
.ph-d{font-size:12px;color:#9CA3AF;margin-top:2px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{opacity:.88}
.btnp{background:#FF4C4C;color:#fff}
.btng{background:#F3F4F6;color:#374151}
.btnd{background:#FEE2E2;color:#BE123C}
.btnok{background:#D1FAE5;color:#15803D}
.btnsm{padding:5px 12px;font-size:11px}
.kpis{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.kpi{flex:1;min-width:110px;border-radius:12px;padding:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 5px rgba(0,0,0,.06);margin-bottom:14px}
.ct{font-size:13px;font-weight:700;color:#111827;margin-bottom:12px}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:7px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:12px}
.tab.on{background:#FF4C4C;color:#fff}
.tab:not(.on){background:#F3F4F6;color:#555}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(173px,1fr));gap:12px;margin-bottom:14px}
.psq{background:#fff;border-radius:14px;padding:14px;cursor:pointer;border-top:4px solid #60A5FA;box-shadow:0 1px 4px rgba(0,0,0,.07);transition:box-shadow .15s,transform .1s}
.psq:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.pt{height:7px;background:#EEEEF5;border-radius:4px;position:relative;margin:6px 0}
.pf2{height:100%;border-radius:4px;pointer-events:none}
.ph2{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transform:translateX(-50%);pointer-events:none}
.ui{padding:10px 13px;border-radius:9px;border-left:3px solid transparent;margin-bottom:8px}
.kbn{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.kcol{min-width:184px;flex:0 0 184px;border-radius:12px;padding:10px}
.kcard{background:#fff;border-radius:8px;padding:10px;margin-bottom:7px;cursor:grab;border-left:3px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.kcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cl{display:flex;border-radius:12px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.06)}
.csb{width:195px;background:#1A1A2E;padding:12px;flex-shrink:0;border-radius:12px 0 0 12px;overflow-y:auto;min-height:450px}
.csbt{font-size:10px;font-weight:700;color:#374151;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.chi{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:#D1D5DB;margin-bottom:2px}
.chi.on{background:#FF4C4C18;color:#FF4C4C;font-weight:700}
.chi:hover:not(.on){background:#ffffff12}
.cm{flex:1;display:flex;flex-direction:column;min-width:0}
.cmh{padding:11px 15px;border-bottom:1px solid #F3F4F6;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.cml{overflow-y:auto;padding:12px 15px;height:310px}
.mi{display:flex;gap:9px;margin-bottom:14px}
.mav{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0}
.mtx{font-size:13px;color:#374151;line-height:1.5;word-break:break-word}
.mtx .men{color:#FF4C4C;font-weight:600;background:#FFF1F0;border-radius:3px;padding:0 3px}
.mrs{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.rb{background:#F3F4F6;border:none;border-radius:10px;padding:2px 8px;font-size:11px;cursor:pointer}
.rb.on{background:#FFEBE9;border:1px solid #FFD6D3}
.cia{padding:10px 15px;border-top:1px solid #F3F4F6;background:#FAFAFA;border-radius:0 0 12px 0}
.cin{width:100%;padding:8px 12px;border:1.5px solid #E5E7EB;border-radius:9px;font-size:13px;font-family:inherit;outline:none;resize:none}
.cin:focus{border-color:#FF4C4C}
.fg{margin-bottom:12px}
.fl{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px}
.fi{width:100%;padding:8px 12px;border:1.5px solid #E5E7EB;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.fi:focus{border-color:#FF4C4C}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-start;justify-content:center;padding-top:40px;overflow-y:auto}
.mov.on{display:flex}
.mox{background:#fff;border-radius:16px;width:560px;max-width:95%;padding:22px;margin-bottom:40px}
.mot{font-size:16px;font-weight:700;color:#111827;margin-bottom:16px}
.ctx{display:none;position:fixed;z-index:300;background:#fff;border-radius:10px;padding:6px;min-width:178px;box-shadow:0 4px 20px rgba(0,0,0,.15);border:1px solid #E5E7EB}
.ctx.on{display:block}
.ci2{padding:7px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:#374151;display:flex;align-items:center;gap:8px}
.ci2:hover{background:#F3F4F6}
.ci2.rd{color:#BE123C}
.ci2.rd:hover{background:#FEE2E2}
.cis{height:1px;background:#F3F4F6;margin:4px 0}
.cism{font-size:10px;color:#9CA3AF;padding:4px 12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.sc{background:#FFFBEB;border-radius:12px;padding:18px;border:2px solid #FCD34D;margin-top:14px}
.sr{display:flex;gap:4px}
.st{font-size:22px;cursor:pointer;color:#D1D5DB;line-height:1}
.st.f{color:#F59E0B}
.eh{background:#FFF1F0;border-radius:8px;padding:9px 12px;font-size:11px;color:#92400E;margin-top:6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:9px 11px;background:#0F1729;color:#fff;text-align:left;white-space:nowrap;font-size:11px;font-weight:600}
td{padding:8px 11px;border-bottom:1px solid #F3F4F6;vertical-align:middle}
tr:hover td{background:#FAFAFE}
.ep{display:flex;flex-wrap:wrap;gap:3px;padding:8px;background:#F9FAFB;border-radius:8px;margin-bottom:8px}
.eb{background:none;border:none;font-size:17px;cursor:pointer;padding:3px;border-radius:4px;width:28px;height:28px;line-height:1}
.eb:hover{background:#E5E7EB}
.lv-card{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;border-left:4px solid;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.es{text-align:center;color:#9CA3AF;padding:40px 20px;font-size:13px}
.pbar{height:8px;background:#EEEEF5;border-radius:4px;overflow:hidden;margin-top:3px}
.pbar-fill{height:100%;border-radius:4px}
.filt-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;padding:10px 14px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.cp{position:absolute;border-radius:50%;animation:fall 2.2s ease-in forwards}
@keyframes fall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

<script>
const USERS=['Sandeep Sugumaran','Anirudh Venkatachalam','Prithvi Dhondaley','Sean Somanna','Aasish Suresh','Aparajitha Rajaram','Ivan Prince','Rahul KD'];
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const todayStr=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');};
const ini=n=>n.split(' ').map(w=>w[0]).join('').substr(0,2).toUpperCase();
const AVC=['#FF4C4C','#7C3AED','#0EA5E9','#10B981','#F43F5E','#8B5CF6','#EC4899','#14B8A6'];

const COLPAL=[{bg:'#F0F9FF',bd:'#38BDF8',tx:'#0369A1'},{bg:'#FEFCE8',bd:'#EAB308',tx:'#A16207'},{bg:'#FDF2F8',bd:'#F472B6',tx:'#BE185D'},{bg:'#ECFDF5',bd:'#34D399',tx:'#047857'},{bg:'#EEF2FF',bd:'#818CF8',tx:'#4338CA'},{bg:'#FFF1F0',bd:'#FF6F6F',tx:'#D93636'}];
function addCol(){const n=(prompt('New column name (e.g. Pre-Production, Shoot, Editing)')||'').trim();if(!n)return;const key=n.toUpperCase();if(COLS.includes(key)){alert('That column already exists.');return;}const col=COLPAL[COLS.length%COLPAL.length];CC[key]={bg:col.bg,bd:col.bd,tx:col.tx,em:'📌'};COLS.push(key);render();}
function renameCol(old){const nn=(prompt('Rename column',old)||'').trim();if(!nn)return;const key=nn.toUpperCase();if(key===old)return;if(COLS.includes(key)){alert('A column with that name already exists.');return;}const i=COLS.indexOf(old);if(i<0)return;COLS[i]=key;CC[key]=CC[old];delete CC[old];S.cards.forEach(c=>{if(c.status===old)c.status=key;});render();}
function delCol(name){const i=COLS.indexOf(name);if(i<0)return;if(COLS.length<=1){alert('You need at least one column.');return;}const has=S.cards.filter(c=>!c.del&&c.status===name);const dest=COLS.find(x=>x!==name);if(has.length){if(!confirm(has.length+' deal(s) in "'+name+'" will move to "'+dest+'". Delete this column?'))return;}else if(!confirm('Delete column "'+name+'"?'))return;has.forEach(c=>c.status=dest);COLS.splice(i,1);delete CC[name];render();}
function rCRM(){const arch=S.cards.filter(c=>!c.del&&c.arch);const isArch=!!S.crmArch;return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap"><div class="tabs" style="margin:0"><button class="tab${!isArch?' on':''}" onclick="S.crmArch=false;render()">🎯 Pipeline</button><button class="tab${isArch?' on':''}" onclick="S.crmArch=true;render()">📦 Archived (${arch.length})</button></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select class="fi" style="max-width:170px" onchange="S.fCrm=this.value;render()"><option value="">👤 All (POC)</option>${POCS.map(u=>`<option value="${u}"${u===(S.fCrm||'')?' selected':''}>${u}</option>`).join('')}</select><select class="fi" style="max-width:170px" onchange="S.fCrmC=this.value;render()"><option value="">🏢 All clients</option>${[...new Set(S.cards.filter(c=>!c.del).map(c=>c.client))].sort().map(c=>`<option value="${c}"${c===(S.fCrmC||'')?' selected':''}>${c}</option>`).join('')}</select>${S.role==='partner'&&!isArch?`<button class="btn btnp btnsm" onclick="addCol()">➕ Add Column</button>`:''}</div></div><div class="kbn">${COLS.map(col=>{const c=CC[col];const cards=S.cards.filter(x=>!x.del&&(!!x.arch===isArch)&&x.status===col&&(!S.fCrm||x.poc===S.fCrm)&&(!S.fCrmC||x.client===S.fCrmC));const shown=(S.colMore&&S.colMore[col])?cards:cards.slice(0,7);return`<div class="kcol" style="background:${c.bg};border:1.5px solid ${c.bd}30" ondragover="event.preventDefault()" ondrop="doDrop(event,'${col}')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${c.tx}">${c.em} ${col}</span><span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;background:${c.bd}25;color:${c.tx}">${cards.length}</span></div><div style="font-size:11px;font-weight:600;margin-bottom:8px;color:${c.tx}">${fmt(cards.reduce((s,c2)=>s+c2.value,0))}</div>${shown.map(card=>`<div class="kcard" style="border-left-color:${c.bd}" draggable="${!isArch}" ondragstart="S.drag.id=${card.id}" ondblclick="${card.status==='WIP'?`opFC(${card.id})`:`mEC(${card.id})`}" oncontextmenu="rCtx(event,${card.id})"><div style="font-weight:700;font-size:12px;color:#111827">${card.client}</div><div style="font-size:11px;color:#9CA3AF;margin:1px 0 6px">${card.project}</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:${c.tx}">${fmt(card.value)}</span><span style="font-size:9px;background:${card.poc===S.user?'#FF4C4C':'#F3F4F6'};color:${card.poc===S.user?'#fff':'#555'};font-weight:${card.poc===S.user?'700':'500'};border-radius:4px;padding:2px 5px">${card.poc===S.user?'👤 ':''}${card.poc.split(' ')[0]}</span></div><div style="font-size:9px;color:#C4C4C4;margin-top:3px">📅 ${card.date}</div>${card.notes?`<div style="font-size:9px;color:#6B7280;margin-top:2px;font-style:italic">${card.notes}</div>`:''}${isArch&&S.role==='partner'?`<div style="display:flex;gap:4px;margin-top:7px"><button class="btn btng btnsm" style="flex:1" onclick="event.stopPropagation();S.cards.find(c=>c.id===${card.id}).arch=false;syncWIP();render()">↩ Restore</button><button class="btn btnd btnsm" onclick="event.stopPropagation();dCard(${card.id})">🗑</button></div>`:''}</div>`).join('')}${cards.length>7?`<button class="btn btng btnsm" style="width:100%;margin-top:2px" onclick="S.colMore=S.colMore||{};S.colMore['${col}']=!S.colMore['${col}'];render()">${S.colMore&&S.colMore[col]?'Show less ↑':'Show all '+cards.length+' ↓'}</button>`:''}<div style="min-height:28px;border-radius:6px;border:2px dashed ${c.bd}20;margin-top:4px"></div></div>`;}).join('')}</div>${isArch&&!arch.length?`<div class="es">📦 No archived deals yet.</div>`:''}`;}
function doDrop(e,col){e.preventDefault();if(!S.drag.id)return;const card=S.cards.find(c=>c.id===S.drag.id);if(!card)return;if(col==='CLOSED'&&!confirm('Confirm completion?')){S.drag.id=null;return;}card.status=col;if(col==='WON')conf();syncWIP();const m=S.MASTER.find(x=>x.cardId===card.id);if(m)m.status=col==='CLOSED'?'Completed':col==='WON'?'Won':'In Progress';S.drag.id=null;render();}
function rCtx(e,cid){e.preventDefault();if(S.role!=='partner')return;const card=S.cards.find(c=>c.id===cid);if(!card)return;const cx=document.getElementById('ctx');cx.style.left=e.clientX+'px';cx.style.top=e.clientY+'px';cx.innerHTML=`<div class="cism">Move to</div>${COLS.filter(c=>c!==card.status).map(col=>`<div class="ci2" onclick="mvC(${cid},'${col}');hCtx()">${CC[col].em} ${col}</div>`).join('')}<div class="cis"></div><div class="ci2" onclick="mEC(${cid});hCtx()">✏️ Edit</div><div class="ci2" onclick="S.cards.find(c=>c.id===${cid}).arch=true;render();hCtx()">📦 Archive</div><div class="ci2 rd" onclick="dCard(${cid});hCtx()">🗑️ Delete</div>`;cx.className='ctx on';}
function hCtx(){document.getElementById('ctx').className='ctx';}
document.addEventListener('click',hCtx);
function mvC(id,col){const card=S.cards.find(c=>c.id===id);if(!card)return;card.status=col;if(col==='WON')conf();syncWIP();const m=S.MASTER.find(x=>x.cardId===id);if(m)m.status=col==='CLOSED'?'Completed':col==='WON'?'Won':'In Progress';render();}
function dCard(id){if(!confirm('Permanently delete?'))return;const c=S.cards.find(c=>c.id===id);if(c)c.del=true;render();}
function opFC(cid){const p=S.projects.find(p=>p.cid===cid);if(p){S.selProj=p;S.view='projects';rnav();render();}}
// Keeps the Project Manager in sync with the CRM pipeline: any card in WIP or
// CLOSED gets a matching project (created once, tracked by card id `cid`), and
// its project status follows the card — WIP card -> WIP project, CLOSED card ->
// Closed project (100% + closed date).
function syncWIP(){S.projects=S.projects.filter(p=>{if(!p.cid)return true;const c=S.cards.find(x=>x.id===p.cid);return c&&!c.del&&!c.arch&&(c.status==='WIP'||c.status==='CLOSED');});S.cards.filter(c=>!c.del&&!c.arch&&(c.status==='WIP'||c.status==='CLOSED')).forEach(card=>{let p=S.projects.find(p=>p.cid===card.id);if(!p){p={id:S.nid.proj++,cid:card.id,client:card.client,name:card.project,lead:card.poc,editor:'',team:[{role:'Lead',person:card.poc},{role:'Editor',person:''},{role:'Cinematographer',person:''}],start:card.date,assigned:new Date().toISOString().split('T')[0],estart:'',close:'',prog:0,budget:card.value,status:'WIP',int:false,type:'Brand Film',upds:[],sc:null,closed:null};S.projects.push(p);}if(card.status==='CLOSED'){if(p.status!=='CLOSED'){p.status='CLOSED';p.prog=100;if(!p.closed)p.closed=card.date||new Date().toISOString().split('T')[0];}}else if(p.status==='CLOSED'){p.status='WIP';p.closed=null;}});}
function mAC(){sm(`<div class="mot">➕ Add New Deal</div><div class="fr"><div class="fg"><label class="fl">Client Name *</label><input class="fi" id="fc-cli"></div><div class="fg"><label class="fl">Project Name *</label><input class="fi" id="fc-prj"></div></div><div class="fr"><div class="fg"><label class="fl">Value (₹) *</label><input class="fi" id="fc-val" type="number"></div><div class="fg"><label class="fl">Internal POC *</label><select class="fi" id="fc-poc">${pocopts('Anirudh Venkatachalam')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Reference</label><select class="fi" id="fc-ref" onchange="tgRef('fc')">${refopts('')}</select></div><div class="fg" id="fc-refc" style="display:none"><label class="fl">Reference name</label><input class="fi" id="fc-refn" placeholder="e.g. Ivan Prince"></div></div><div class="fr"><div class="fg"><label class="fl">Date *</label><input class="fi" id="fc-dt" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="fl">Stage</label><select class="fi" id="fc-st">${COLS.map(c=>`<option>${c}</option>`).join('')}</select></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAC()">Add Deal</button></div>`);}
function sbAC(){const cli=document.getElementById('fc-cli').value.trim(),prj=document.getElementById('fc-prj').value.trim();if(!cli||!prj){alert('Client and project required.');return;}const st=document.getElementById('fc-st').value;S.cards.push({id:S.nid.card++,client:cli,project:prj,value:parseInt(document.getElementById('fc-val').value)||0,poc:document.getElementById('fc-poc').value,ref:refVal('fc'),date:document.getElementById('fc-dt').value,status:st,arch:false,del:false,notes:''});if(st==='WON')conf();syncWIP();hm();render();}
function mEC(id){const c=S.cards.find(c=>c.id===id);if(!c)return;sm(`<div class="mot">✏️ Edit Deal</div><div class="fr"><div class="fg"><label class="fl">Client</label><input class="fi" id="ec-cli" value="${c.client}"></div><div class="fg"><label class="fl">Project</label><input class="fi" id="ec-prj" value="${c.project}"></div></div><div class="fr"><div class="fg"><label class="fl">Value (₹)</label><input class="fi" id="ec-val" type="number" value="${c.value}"></div><div class="fg"><label class="fl">POC</label><select class="fi" id="ec-poc">${pocopts(c.poc)}</select></div></div><div class="fr"><div class="fg"><label class="fl">Reference</label><select class="fi" id="ec-ref" onchange="tgRef('ec')">${refopts(c.ref)}</select></div><div class="fg" id="ec-refc" style="display:${REFS.includes(c.ref)?'none':''}"><label class="fl">Reference name</label><input class="fi" id="ec-refn" value="${REFS.includes(c.ref)?'':c.ref}"></div></div><div class="fr"><div class="fg"><label class="fl">Date</label><input class="fi" id="ec-dt" type="date" value="${c.date}"></div></div><div class="fg"><label class="fl">Notes</label><input class="fi" id="ec-nt" value="${c.notes||''}"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbEC(${id})">Save</button></div>`);}
function sbEC(id){const c=S.cards.find(c=>c.id===id);if(!c)return;c.client=document.getElementById('ec-cli').value||c.client;c.project=document.getElementById('ec-prj').value||c.project;c.value=parseInt(document.getElementById('ec-val').value)||c.value;c.poc=document.getElementById('ec-poc').value;c.ref=refVal('ec')||c.ref;c.date=document.getElementById('ec-dt').value||c.date;c.notes=document.getElementById('ec-nt').value;hm();render();}
function rPL(){syncWIP();const pf=p=>(!S.fProj||projTeam(p).some(m=>m.person===S.fProj))&&(!S.fProjC||p.client===S.fProjC);const wip=S.projects.filter(p=>p.status==='WIP'&&pf(p)).sort((a,b)=>((b.assigned||b.start||'')).localeCompare(a.assigned||a.start||''));const cls=S.projects.filter(p=>p.status==='CLOSED'&&pf(p)).sort((a,b)=>(b.closed||'').localeCompare(a.closed||''));const showCls=S.projClosedAll?cls:cls.slice(0,10);const showWip=S.projWipAll?wip:wip.slice(0,10);return`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><div class="tabs" style="margin:0"><button class="tab${S.projTab==='wip'?' on':''}" onclick="S.projTab='wip';render()">🔨 WIP (${wip.length})</button><button class="tab${S.projTab==='closed'?' on':''}" onclick="S.projTab='closed';render()">✅ Closed (${cls.length})</button></div><div style="display:flex;gap:8px"><select class="fi" style="max-width:170px" onchange="S.fProj=this.value;render()"><option value="">👤 All people</option>${USERS.map(u=>`<option value="${u}"${u===(S.fProj||'')?' selected':''}>${u}</option>`).join('')}</select><select class="fi" style="max-width:170px" onchange="S.fProjC=this.value;render()"><option value="">🏢 All clients</option>${[...new Set(S.projects.map(p=>p.client))].sort().map(c=>`<option value="${c}"${c===(S.fProjC||'')?' selected':''}>${c}</option>`).join('')}</select></div></div>${S.projTab==='wip'?`<div class="pgrid">${showWip.map(p=>{const pb=p.prog>70?'#4ADE80':p.prog>40?'#FCD34D':'#FB7185';const pc=p.prog>70?'#15803D':p.prog>40?'#B45309':'#BE123C';return`<div class="psq" style="border-top-color:${pb}" onclick="S.selProj=S.projects.find(x=>x.id===${p.id});S.viewAll=false;render()"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${pc};margin-bottom:3px">${p.client}</div><div style="font-size:13px;font-weight:700;color:#111827;margin-bottom:8px;line-height:1.3">${p.name}</div><div class="pt"><div class="pf2" style="width:${p.prog}%;background:${pb}"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;font-weight:700;color:${pc}">${p.prog}%</span></div><div style="font-size:10px;color:#9CA3AF">👑 ${p.lead.split(' ')[0]} ${p.lead2?'/ '+p.lead2.split(' ')[0]:''}</div><div style="font-size:10px;color:#9CA3AF">✂️ ${p.editor||'—'}</div><div style="font-size:10px;color:#9CA3AF">📥 ${p.assigned||p.start||'—'}</div><div style="font-size:10px;color:#9CA3AF">📅 ${p.close||'—'}${dueWarn(p)}</div><div style="font-size:10px;color:#60A5FA;margin-top:6px">${p.upds.length} update${p.upds.length!==1?'s':''}</div></div>`;}).join('')||`<div class="es">No active projects</div>`}</div>${wip.length>10?`<button class="btn btng btnsm" style="width:100%;margin-top:4px" onclick="S.projWipAll=!S.projWipAll;render()">${S.projWipAll?'Show recent ↑':'Show more ('+(wip.length-10)+' older) ↓'}</button>`:''}`:`<div class="pgrid">${showCls.map(p=>`<div class="psq" style="border-top-color:#A78BFA" onclick="S.selProj=S.projects.find(x=>x.id===${p.id});S.viewAll=false;render()"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#6D28D9;margin-bottom:3px">${p.client}</div><div style="font-size:13px;font-weight:700;color:#111827;margin-bottom:8px;line-height:1.3">${p.name}</div><div class="pt"><div class="pf2" style="width:100%;background:#A78BFA"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;font-weight:700;color:#6D28D9">100%</span></div><div style="font-size:10px;color:#9CA3AF">👑 ${p.lead.split(' ')[0]}${p.lead2?' / '+p.lead2.split(' ')[0]:''}</div><div style="font-size:10px;color:#9CA3AF">✂️ ${p.editor||'—'}</div><div style="font-size:10px;color:#9CA3AF">📥 ${p.assigned||p.start||'—'}</div><div style="font-size:10px;color:#9CA3AF">✅ Closed ${p.closed||'—'}</div>${p.sc?`<div style="font-size:10px;color:#F59E0B;margin-top:4px">${'★'.repeat(Math.round(Object.values(p.sc.scores).reduce((a,b)=>a+b,0)/4))} Editor rated</div>`:''}<div style="font-size:10px;color:#60A5FA;margin-top:6px">${p.upds.length} update${p.upds.length!==1?'s':''}</div></div>`).join('')||`<div class="es">No closed projects yet</div>`}</div>${cls.length>10?`<button class="btn btng btnsm" style="width:100%;margin-top:4px" onclick="S.projClosedAll=!S.projClosedAll;render()">${S.projClosedAll?'Show recent ↑':'Show more ('+(cls.length-10)+' older) ↓'}</button>`:''}`}`;}

function dlyTick(){const el=document.getElementById('dlyTimer');if(!el)return;const n=new Date();const dl=new Date(n.getFullYear(),n.getMonth(),n.getDate(),22,0,0);const ms=dl-n;if(ms<=0){el.textContent='⏰ Past the 10:00 PM deadline';el.style.color='#BE123C';el.style.background='#FFF1F2';el.style.borderColor='#FECDD3';return;}const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4);el.textContent='⏳ '+(h?h+'h ':'')+m+'m left — closes 10:00 PM';}

function menHtml(t){USERS.forEach((u,i)=>{t=t.replace(new RegExp('@'+u.replace(/ /g,'\\s+'),'gi'),'\x01F'+i+'\x02');});USERS.forEach((u,i)=>{t=t.replace(new RegExp('@'+u.split(' ')[0]+'\\b','gi'),'\x01N'+i+'\x02');});USERS.forEach((u,i)=>{t=t.split('\x01F'+i+'\x02').join('<span class="men">@'+u+'</span>');t=t.split('\x01N'+i+'\x02').join('<span class="men">@'+u.split(' ')[0]+'</span>');});return t;}
function mentInput(chId){const inp=document.getElementById('ci'+chId);const dd=document.getElementById('mdd');if(!inp||!dd)return;const pos=inp.selectionStart;const before=inp.value.slice(0,pos);const m=before.match(/@([A-Za-z]{0,20})$/);if(!m){dd.style.display='none';return;}const q=m[1].toLowerCase();const opts=USERS.filter(u=>u!==S.user&&(q===''||u.toLowerCase().startsWith(q)||(u.split(' ')[1]||'').toLowerCase().startsWith(q)));if(!opts.length){dd.style.display='none';return;}dd.innerHTML=`<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#9CA3AF;padding:7px 12px 3px">Mention</div>`+opts.map(u=>`<div onmousedown="event.preventDefault();pickMent(${chId},'${u}')" style="padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px" onmouseover="this.style.background='#FFF1F0'" onmouseout="this.style.background=''"><div class="mav" style="background:${avcol(u)};width:22px;height:22px;font-size:8px">${ini(u)}</div>${u}</div>`).join('');dd.style.display='block';}

function sndMsg(chId){const inp=document.getElementById('ci'+chId);const txt=inp?.value.trim();if(!txt)return;const ch=S.chs.find(c=>c.id===chId);if(!ch)return;const lo=txt.toLowerCase();const tags=USERS.filter(u=>lo.includes('@'+u.toLowerCase())||new RegExp('@'+u.split(' ')[0]+'\\b','i').test(txt));const now=new Date();
  if(inp)inp.value='';S.showEP=false;

  ch.msgs.push({id:S.nid.msg++,from:S.user,text:txt,time:now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),date:now.toLocaleDateString('en',{month:'short',day:'numeric'}),rx:{},tags});render();}

function mACh(){sm(`<div class="mot">💬 New Channel</div><div class="fg"><label class="fl">Channel Name *</label><input class="fi" id="ch-nm" placeholder="e.g. project-name or weekly-sync"></div><div class="fg"><label class="fl">Members</label>${USERS.map((u,i)=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px"><input type="checkbox" id="chm-${i}" ${u===S.user?'checked disabled':''}> ${u}</label>`).join('')}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbACh()">Create Channel</button></div>`);}
function sbACh(){const nm=document.getElementById('ch-nm')?.value.trim().toLowerCase().replace(/\s+/g,'-');if(!nm){alert('Channel name required');return;}const mem=USERS.filter((u,i)=>document.getElementById('chm-'+i)?.checked||u===S.user);

function mAMem(chId){const ch=S.chs.find(c=>c.id===chId);if(!ch)return;const av=USERS.filter(u=>!ch.members.includes(u));sm(`<div class="mot">➕ Add to #${ch.name}</div>${av.length?av.map((u,i)=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px"><input type="checkbox" id="nm-${i}"> ${u}</label>`).join(''):'<div style="color:#9CA3AF;font-size:13px">All users already members.</div>'}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAMem(${chId})">Add</button></div>`);}
function sbAMem(chId){const ch=S.chs.find(c=>c.id===chId);const av=USERS.filter(u=>!ch.members.includes(u));av.forEach((u,i)=>{if(document.getElementById('nm-'+i)?.checked)ch.members.push(u);});if(chatLive)SB.from('chat_channels').update({members:ch.members}).eq('id',chId).then(()=>{});hm();render();}
function filtMaster(){if(S.trkFilt==='monthly')return S.MASTER.filter(m=>m.date&&m.date.startsWith(S.trkMon));if(S.trkFilt==='fy')return S.MASTER.filter(m=>m.date&&m.date>='2026-04-01'&&m.date<='2027-03-31');return S.MASTER;}
function filtLedger(){if(S.ledFilt==='monthly')return S.LEDGER.filter(l=>l.date&&l.date.startsWith(S.ledMon));if(S.ledFilt==='fy')return S.LEDGER.filter(l=>l.date&&l.date>='2026-04-01'&&l.date<='2027-03-31');return S.LEDGER;}
function rFin(){return`<div class="tabs"><button class="tab${S.finTab==='tracker'?' on':''}" onclick="S.finTab='tracker';render()">📊 Project Tracker</button><button class="tab${S.finTab==='ledger'?' on':''}" onclick="S.finTab='ledger';render()">📒 Payment Ledger</button></div>${S.finTab==='tracker'?rTracker():rLedger()}`;}
function rTracker(){const rows=filtMaster();const totVal=rows.reduce((s,r)=>s+r.val,0);const totGst=rows.reduce((s,r)=>s+r.gst,0);const totTot=rows.reduce((s,r)=>s+r.tot,0);const paid=rows.filter(r=>r.pay==='Paid').reduce((s,r)=>s+r.tot,0);return`<div class="filt-bar"><div style="font-weight:600;font-size:12px;color:#374151;margin-right:4px">Filter:</div><button class="tab${S.trkFilt==='all'?' on':''} btnsm" onclick="S.trkFilt='all';render()">All</button><button class="tab${S.trkFilt==='monthly'?' on':''} btnsm" onclick="S.trkFilt='monthly';render()">Monthly</button><button class="tab${S.trkFilt==='fy'?' on':''} btnsm" onclick="S.trkFilt='fy';render()">FY 26-27</button>${S.trkFilt==='monthly'?`<select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.trkMon=this.value;render()">${MONTHS.map(m=>`<option value="${m.v}"${m.v===S.trkMon?' selected':''}>${m.l}</option>`).join('')}</select>`:''}${S.trkFilt==='fy'?`<span style="font-size:11px;color:#9CA3AF">Apr 2026 – Mar 2027</span>`:''}<div style="margin-left:auto"><button class="btn btnp btnsm" onclick="mAddMaster()">+ Add Entry</button></div></div><div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">${[{lb:'Project Value',v:fmt(totVal),ic:'💼'},{lb:'GST (18%)',v:fmt(totGst),ic:'🏛️'},{lb:'Total Invoiced',v:fmt(totTot),ic:'📄'},{lb:'Collected',v:fmt(paid),ic:'✅'}].map(m=>`<div style="flex:1;min-width:120px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-size:18px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin:3px 0;color:#111827">${m.v}</div><div style="font-size:11px;color:#9CA3AF">${m.lb}</div></div>`).join('')}</div><div class="tbl"><table><tr><th>Brand</th><th>Project</th><th>Client POC</th><th>Int. POC</th><th>Status</th><th>Project Value</th><th>GST (18%)</th><th>Total</th><th>PO Raised</th><th>Invoice</th><th>Payment</th><th>Date</th><th>Action</th></tr>${rows.map((r,i)=>`<tr style="background:${i%2===0?'#FAFAFA':'#fff'}"><td style="font-weight:700">${r.brand}</td><td style="font-size:11px;white-space:normal;max-width:120px">${r.proj}</td><td>${r.cpoc||'—'}</td><td>${r.ipoc||'—'}</td><td><span class="badge" style="background:${r.status==='Completed'?'#D1FAE5':r.status==='In Progress'?'#EFF6FF':'#F0FDF4'};color:${r.status==='Completed'?'#15803D':r.status==='In Progress'?'#1D4ED8':'#15803D'}">${r.status}</span></td><td style="text-align:right;font-weight:700">${fmt(r.val)}</td><td style="text-align:right">${fmt(r.gst)}</td><td style="text-align:right;font-weight:700;color:#7C3AED">${fmt(r.tot)}</td><td><span class="badge" style="background:${r.po==='Yes'?'#D1FAE5':'#F3F4F6'};color:${r.po==='Yes'?'#15803D':'#6B7280'}">${r.po}</span></td><td><span class="badge" style="background:${r.inv==='Raised'?'#D1FAE5':'#FEF3C7'};color:${r.inv==='Raised'?'#15803D':'#92400E'}">${r.inv}</span></td><td><span class="badge" style="background:${r.pay==='Paid'?'#D1FAE5':r.pay==='Advance Paid'?'#FEF3C7':'#FEE2E2'};color:${r.pay==='Paid'?'#15803D':r.pay==='Advance Paid'?'#92400E':'#BE123C'}">${r.pay}</span></td><td style="font-size:11px">${r.date}</td><td><button class="btn btng btnsm" onclick="mEditMaster(${r.id})">✏️</button></td></tr>`).join('')}<tr style="background:#0F1729;color:#fff"><td colspan="5" style="padding:9px 11px;font-weight:700">TOTAL (${rows.length} projects)</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totVal)}</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totGst)}</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totTot)}</td><td colspan="5" style="padding:9px 11px;text-align:right">${fmt(paid)} collected</td></tr></table></div>`;}
function rLedger(){const rows=filtLedger();const totOut=rows.reduce((s,l)=>{const c=calcL(l);return s+c.tot;},0);const totYtc=rows.reduce((s,l)=>{const c=calcL(l);return s+c.ytc;},0);const totClr=rows.reduce((s,l)=>{const c=calcL(l);return s+(l.pay==='Cleared'?c.tot:0);},0);return`<div class="filt-bar"><div style="font-weight:600;font-size:12px;color:#374151;margin-right:4px">Filter:</div><button class="tab${S.ledFilt==='all'?' on':''} btnsm" onclick="S.ledFilt='all';render()">All</button><button class="tab${S.ledFilt==='monthly'?' on':''} btnsm" onclick="S.ledFilt='monthly';render()">Monthly</button><button class="tab${S.ledFilt==='fy'?' on':''} btnsm" onclick="S.ledFilt='fy';render()">FY 26-27</button>${S.ledFilt==='monthly'?`<select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.ledMon=this.value;render()">${MONTHS.map(m=>`<option value="${m.v}"${m.v===S.ledMon?' selected':''}>${m.l}</option>`).join('')}</select>`:''}<div style="margin-left:auto"><button class="btn btnp btnsm" onclick="mAddLedger()">+ Add Entry</button></div></div><div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">${[{lb:'Total Outgoing',v:fmt(totOut),ic:'📤'},{lb:'Cleared',v:fmt(totClr),ic:'✅'},{lb:'Pending',v:fmt(totYtc),ic:'⏳'},{lb:'Entries',v:rows.length,ic:'📋'}].map(m=>`<div style="flex:1;min-width:110px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-size:18px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin:3px 0;color:#111827">${m.v}</div><div style="font-size:11px;color:#9CA3AF">${m.lb}</div></div>`).join('')}</div><div class="tbl"><table><tr><th>Name</th><th>Project</th><th>Amount</th><th>Tax%</th><th>Tax Amt</th><th>Total</th><th>TDS%</th><th>TDS Amt</th><th>After TDS</th><th>Invoice</th><th>Payment</th><th>Yet to Clear</th><th>Date</th><th>Remarks</th><th>Action</th></tr>${rows.map((l,i)=>{const c=calcL(l);return`<tr style="background:${l.pay==='Cleared'?'#F0FDF4':i%2===0?'#FAFAFA':'#fff'}"><td style="font-weight:600;white-space:normal;max-width:110px">${l.name}</td><td style="font-size:11px;white-space:normal;max-width:100px">${l.proj}</td><td style="text-align:right">${fmt(l.amt)}</td><td style="text-align:center">${l.taxPct}%</td><td style="text-align:right">${fmt(c.ta)}</td><td style="text-align:right;font-weight:700">${fmt(c.tot)}</td><td style="text-align:center">${l.tdsPct}%</td><td style="text-align:right">${fmt(c.tdsAmt)}</td><td style="text-align:right;font-weight:700">${fmt(c.at)}</td><td><span class="badge" style="background:${l.inv==='Sent'?'#D1FAE5':'#FEE2E2'};color:${l.inv==='Sent'?'#15803D':'#BE123C'}">${l.inv}</span></td><td><span class="badge" style="background:${l.pay==='Cleared'?'#D1FAE5':'#FEF3C7'};color:${l.pay==='Cleared'?'#15803D':'#92400E'}">${l.pay}</span></td><td style="text-align:right;font-weight:700;color:${c.ytc>0?'#BE123C':'#15803D'}">${fmt(c.ytc)}</td><td style="font-size:11px">${l.date}</td><td style="font-size:11px;color:#666;white-space:normal;max-width:80px">${l.rem||'—'}</td><td><button class="btn btng btnsm" onclick="mEditLedger(${l.id})">✏️</button></td></tr>`;}).join('')}<tr style="background:#0F1729;color:#fff"><td colspan="2" style="padding:9px 11px;font-weight:700">TOTAL</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(rows.reduce((s,l)=>s+l.amt,0))}</td><td colspan="2"></td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totOut)}</td><td colspan="2"></td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(rows.reduce((s,l)=>s+calcL(l).at,0))}</td><td colspan="2"></td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totYtc)}</td><td colspan="3"></td></tr></table></div>`;}
function mAddMaster(){sm(`<div class="mot">📊 Add to Project Tracker</div><div class="fr"><div class="fg"><label class="fl">Brand / Client *</label><input class="fi" id="am-brand"></div><div class="fg"><label class="fl">Project Name *</label><input class="fi" id="am-proj"></div></div><div class="fr"><div class="fg"><label class="fl">Client POC</label><select class="fi" id="am-cpoc">${uoptsB('')}</select></div><div class="fg"><label class="fl">Internal POC *</label><select class="fi" id="am-ipoc">${uopts('Anirudh Venkatachalam')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Status</label><select class="fi" id="am-st">${PSTATUS.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="fg"><label class="fl">Date</label><input class="fi" id="am-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="fr"><div class="fg"><label class="fl">Project Value (₹) *</label><input class="fi" id="am-val" type="number" oninput="const v=+this.value||0;const g=Math.round(v*.18);document.getElementById('am-gst').value=g;document.getElementById('am-tot').value=v+g"></div><div class="fg"><label class="fl">GST (auto 18%)</label><input class="fi" id="am-gst" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">Total (auto)</label><input class="fi" id="am-tot" readonly style="background:#F3F4F6"></div><div class="fg"><label class="fl">PO Raised</label><select class="fi" id="am-po"><option>No</option><option>Yes</option><option>NA</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Invoice</label><select class="fi" id="am-inv"><option>Not Raised</option><option>Raised</option></select></div><div class="fg"><label class="fl">Payment</label><select class="fi" id="am-pay"><option>Not Paid</option><option>Advance Paid</option><option>Paid</option></select></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAddMaster()">Add Entry</button></div>`);}
function sbAddMaster(){const brand=document.getElementById('am-brand').value.trim();const proj=document.getElementById('am-proj').value.trim();if(!brand||!proj){alert('Brand and project required.');return;}const val=parseInt(document.getElementById('am-val').value)||0;const gst=Math.round(val*.18);S.MASTER.push({id:S.nid.master++,cardId:null,brand,proj,cpoc:document.getElementById('am-cpoc').value,ipoc:document.getElementById('am-ipoc').value,status:document.getElementById('am-st').value,val,gst,tot:val+gst,po:document.getElementById('am-po').value,inv:document.getElementById('am-inv').value,pay:document.getElementById('am-pay').value,date:document.getElementById('am-date').value});hm();render();}
function mEditMaster(id){const r=S.MASTER.find(x=>x.id===id);if(!r)return;sm(`<div class="mot">✏️ Edit Project Entry</div><div class="fr"><div class="fg"><label class="fl">Brand</label><input class="fi" id="em-brand" value="${r.brand}"></div><div class="fg"><label class="fl">Project</label><input class="fi" id="em-proj" value="${r.proj}"></div></div><div class="fr"><div class="fg"><label class="fl">Client POC</label><select class="fi" id="em-cpoc">${uoptsB(r.cpoc)}</select></div><div class="fg"><label class="fl">Internal POC</label><select class="fi" id="em-ipoc">${uopts(r.ipoc)}</select></div></div><div class="fr"><div class="fg"><label class="fl">Status</label><select class="fi" id="em-st">${PSTATUS.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></div><div class="fg"><label class="fl">Date</label><input class="fi" id="em-date" type="date" value="${r.date}"></div></div><div class="fr"><div class="fg"><label class="fl">Project Value (₹)</label><input class="fi" id="em-val" type="number" value="${r.val}" oninput="const v=+this.value||0;const g=Math.round(v*.18);document.getElementById('em-gst').value=g;document.getElementById('em-tot').value=v+g"></div><div class="fg"><label class="fl">GST (18%)</label><input class="fi" id="em-gst" value="${r.gst}" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">Total</label><input class="fi" id="em-tot" value="${r.tot}" readonly style="background:#F3F4F6"></div><div class="fg"><label class="fl">PO Raised</label><select class="fi" id="em-po">${['No','Yes','NA'].map(x=>`<option${x===r.po?' selected':''}>${x}</option>`).join('')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Invoice</label><select class="fi" id="em-inv">${['Not Raised','Raised'].map(x=>`<option${x===r.inv?' selected':''}>${x}</option>`).join('')}</select></div><div class="fg"><label class="fl">Payment</label><select class="fi" id="em-pay">${['Not Paid','Advance Paid','Paid'].map(x=>`<option${x===r.pay?' selected':''}>${x}</option>`).join('')}</select></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbEditMaster(${id})">Save Changes</button></div>`);}
function sbEditMaster(id){const r=S.MASTER.find(x=>x.id===id);if(!r)return;r.brand=document.getElementById('em-brand').value||r.brand;r.proj=document.getElementById('em-proj').value||r.proj;r.cpoc=document.getElementById('em-cpoc').value;r.ipoc=document.getElementById('em-ipoc').value;r.status=document.getElementById('em-st').value;r.date=document.getElementById('em-date').value||r.date;const val=parseInt(document.getElementById('em-val').value)||r.val;r.val=val;r.gst=Math.round(val*.18);r.tot=val+r.gst;r.po=document.getElementById('em-po').value;r.inv=document.getElementById('em-inv').value;r.pay=document.getElementById('em-pay').value;hm();render();}
function mAddLedger(){const projOpts=S.MASTER.map(m=>`<option value="${m.proj}">${m.brand} — ${m.proj}</option>`).join('');sm(`<div class="mot">📒 Add Payment Entry</div><div class="fr"><div class="fg"><label class="fl">Name (Vendor/Cast/Crew) *</label><input class="fi" id="al-name"></div><div class="fg"><label class="fl">Project</label><select class="fi" id="al-proj"><option value="">— Select Project —</option>${projOpts}<option value="SSF">SSF / Other</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Amount (₹) *</label><input class="fi" id="al-amt" type="number" oninput="calcAlFields()"></div><div class="fg"><label class="fl">Tax %</label><select class="fi" id="al-tax" onchange="calcAlFields()"><option value="0">0%</option><option value="18">18%</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Tax Amount (auto)</label><input class="fi" id="al-ta" readonly style="background:#F3F4F6"></div><div class="fg"><label class="fl">Total (auto)</label><input class="fi" id="al-tot" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">TDS %</label><select class="fi" id="al-tds" onchange="calcAlFields()"><option value="0">0%</option><option value="1">1%</option><option value="2">2%</option><option value="10">10%</option></select></div><div class="fg"><label class="fl">After TDS (auto)</label><input class="fi" id="al-at" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">Invoice Status</label><select class="fi" id="al-inv"><option value="Yet to send">Yet to send</option><option value="Sent">Sent</option></select></div><div class="fg"><label class="fl">Payment Status</label><select class="fi" id="al-pay"><option value="Pending">Pending</option><option value="Cleared">Cleared</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Date</label><input class="fi" id="al-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="fl">Remarks</label><input class="fi" id="al-rem"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAddLedger()">Add Entry</button></div>`);}
function calcAlFields(){const amt=parseFloat(document.getElementById('al-amt')?.value)||0;const tax=parseFloat(document.getElementById('al-tax')?.value)||0;const tds=parseFloat(document.getElementById('al-tds')?.value)||0;const ta=Math.round(amt*tax/100);const tot=amt+ta;const tdsAmt=Math.round(tot*tds/100);const at=tot-tdsAmt;if(document.getElementById('al-ta'))document.getElementById('al-ta').value=ta;if(document.getElementById('al-tot'))document.getElementById('al-tot').value=tot;if(document.getElementById('al-at'))document.getElementById('al-at').value=at;}
function sbAddLedger(){const name=document.getElementById('al-name').value.trim();if(!name){alert('Name required.');return;}S.LEDGER.push({id:S.nid.led++,name,proj:document.getElementById('al-proj').value||'Other',amt:parseInt(document.getElementById('al-amt').value)||0,taxPct:parseInt(document.getElementById('al-tax').value)||0,tdsPct:parseInt(document.getElementById('al-tds').value)||0,inv:document.getElementById('al-inv').value,pay:document.getElementById('al-pay').value,date:document.getElementById('al-date').value,rem:document.getElementById('al-rem').value});hm();render();}

:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbEditLedger(${id})">Save</button></div>`);}
function sbEditLedger(id){const l=S.LEDGER.find(x=>x.id===id);if(!l)return;l.name=document.getElementById('el-name').value||l.name;l.proj=document.getElementById('el-proj').value||l.proj;l.amt=parseInt(document.getElementById('el-amt').value)||l.amt;l.taxPct=parseInt(document.getElementById('el-tax').value)||0;l.tdsPct=parseInt(document.getElementById('el-tds').value)||0;l.inv=document.getElementById('el-inv').value;l.pay=document.getElementById('el-pay').value;l.date=document.getElementById('el-date').value||l.date;l.rem=document.getElementById('el-rem').value;hm();render();}
function rRep(){syncMaster();const ac=S.cards.filter(c=>!c.del);const won=ac.filter(c=>['WON','WIP','CLOSED'].includes(c.status));const lost=ac.filter(c=>c.status==='LOST');const totLedOut=S.LEDGER.reduce((s,l)=>s+calcL(l).tot,0);const totLedYtc=S.LEDGER.reduce((s,l)=>s+calcL(l).ytc,0);const totRev=S.MASTER.reduce((s,m)=>s+m.tot,0);const totCollected=S.MASTER.filter(m=>m.pay==='Paid').reduce((s,m)=>s+m.tot,0);const totPending=S.MASTER.filter(m=>m.pay!=='Paid').reduce((s,m)=>s+m.tot,0);return`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn btnp" onclick="xlAll()">⬇ Download All (Excel)</button><button class="btn btng" onclick="xlExp('crm')">CRM Sheet</button><button class="btn btng" onclick="xlExp('proj')">Project Tracker Sheet</button><button class="btn btng" onclick="xlExp('ledger')">Payment Ledger Sheet</button><button class="btn btng" onclick="xlExp('daily')">Daily Updates Sheet</button></div><div class="kpis">${[{lb:'Total Invoiced (incl. GST)',v:fmt(totRev),ic:'📄',c:'#7C3AED',bg:'#F5F3FF'},{lb:'Collected',v:fmt(totCollected),ic:'✅',c:'#15803D',bg:'#F0FDF4'},{lb:'Pending Collection',v:fmt(totPending),ic:'⏳',c:'#D93636',bg:'#FFF1F0'},{lb:'Total Outgoing',v:fmt(totLedOut),ic:'💸',c:'#BE123C',bg:'#FFF1F2'},{lb:'Yet to Clear',v:fmt(totLedYtc),ic:'⚠️',c:'#92400E',bg:'#FFFBEB'}].map(m=>`<div class="kpi" style="background:${m.bg}"><div style="font-size:16px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin-bottom:2px;color:${m.c}">${m.v}</div><div style="font-size:10px;opacity:.75;color:${m.c}">${m.lb}</div></div>`).join('')}</div><div class="g2"><div class="card"><div class="ct">💰 Project Value vs Status</div>${S.MASTER.map(m=>{const col=m.status==='Completed'?'#4ADE80':m.status==='In Progress'?'#60A5FA':'#FCD34D';return`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.brand}</span><span class="badge" style="background:${m.status==='Completed'?'#D1FAE5':m.status==='In Progress'?'#EFF6FF':'#F0FDF4'};color:${m.status==='Completed'?'#15803D':m.status==='In Progress'?'#1D4ED8':'#15803D'}">${m.status}</span></div><div class="pbar"><div class="pbar-fill" style="width:${(m.tot/Math.max(S.MASTER.reduce((s,x)=>Math.max(s,x.tot),0),1)*100).toFixed(0)}%;background:${col}"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#9CA3AF;margin-top:2px"><span>${m.proj} · ${fmt(m.val)} + GST ${fmt(m.gst)}</span><span style="color:${m.pay==='Paid'?'#15803D':'#9CA3AF'}">${m.pay}</span></div></div>`;}).join('')}</div><div><div class="card"><div class="ct">🎯 CRM Win / Loss</div>${[{lb:'Won + WIP + Closed',n:won.length,t:ac.length,c:'#4ADE80',cv:'#15803D',v:won.reduce((s,c)=>s+c.value,0)},{lb:'In Pipeline',n:ac.filter(c=>['ENQUIRIES','ESTIMATE SENT'].includes(c.status)).length,t:ac.length,c:'#818CF8',cv:'#4338CA',v:0},{lb:'Lost',n:lost.length,t:ac.length,c:'#FB7185',cv:'#BE123C',v:lost.reduce((s,c)=>s+c.value,0)}].map(m=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.lb}</span><span style="font-weight:700;color:${m.cv}">${Math.round(m.n/Math.max(1,m.t)*100)}% (${m.n})</span></div><div class="pbar" style="height:9px"><div class="pbar-fill" style="width:${Math.round(m.n/Math.max(1,m.t)*100)}%;background:${m.c}"></div></div>${m.v?`<div style="font-size:10px;color:#9CA3AF;margin-top:2px">Value: ${fmt(m.v)}</div>`:''}</div>`).join('')}<div style="margin-top:14px">${[['Total CRM Deals',ac.length],['Win Rate',Math.round(won.length/Math.max(1,ac.length)*100)+'%'],['Total Pipeline Value',fmt(ac.reduce((s,c)=>s+c.value,0))],['Archived',S.cards.filter(c=>c.arch).length]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#F8F8FF;border-radius:8px;margin-bottom:4px;font-size:12px"><span>${l}</span><span style="font-weight:700">${v}</span></div>`).join('')}</div></div><div class="card"><div class="ct">💳 Payment Status</div>${[{lb:'Collected (Paid)',v:totCollected,t:totRev,c:'#4ADE80'},{lb:'Not Yet Collected',v:totPending,t:totRev,c:'#FB7185'},{lb:'Outgoing Cleared',v:S.LEDGER.filter(l=>l.pay==='Cleared').reduce((s,l)=>s+calcL(l).tot,0),t:totLedOut,c:'#4ADE80'},{lb:'Outgoing Pending',v:totLedYtc,t:totLedOut,c:'#FB7185'}].map(m=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.lb}</span><span style="font-weight:700">${fmt(m.v)}</span></div><div class="pbar" style="height:9px"><div class="pbar-fill" style="width:${m.t?Math.round(m.v/m.t*100):0}%;background:${m.c}"></div></div></div>`).join('')}</div></div></div><div class="card"><div class="ct">👥 Team Workload</div><div class="g3">${USERS.map(u=>{const projs=S.projects.filter(p=>p.status==='WIP'&&[p.lead,p.lead2,p.prod,p.post,p.editor].includes(u));const c=projs.length>=3?'#FB7185':projs.length>=2?'#FCD34D':'#4ADE80';return`<div style="background:#F8F8FF;border-radius:9px;padding:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div class="mav" style="background:${avcol(u)};width:30px;height:30px;font-size:10px">${ini(u)}</div><div><div style="font-weight:600;font-size:12px">${u}</div><div style="font-size:10px;color:#9CA3AF">${projs.length} active projects</div></div></div><div class="pbar" style="height:8px"><div class="pbar-fill" style="width:${Math.min(projs.length/3*100,100)}%;background:${c}"></div></div>${projs.map(p=>`<div style="font-size:10px;color:#6B7280;margin-top:3px">· ${p.name}</div>`).join('')}</div>`;}).join('')}</div></div>`;}
function xlAll(){xlExp('all');}
function xlExp(type){if(!window.XLSX){alert('Excel library loading, try again.');return;}const wb=XLSX.utils.book_new();function add(d,n){if(d.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n);}if(type==='all'||type==='crm')add(S.cards.filter(c=>!c.del).map(c=>({Client:c.client,Project:c.project,Stage:c.status,Value:c.value,POC:c.poc,Reference:c.ref,Date:c.date,Archived:c.arch?'Yes':'No',Notes:c.notes})),'CRM Pipeline');if(type==='all'||type==='proj')add(S.MASTER.map(m=>({Brand:m.brand,Project:m.proj,'Client POC':m.cpoc,'Internal POC':m.ipoc,Status:m.status,'Project Value':m.val,'GST (18%)':m.gst,'Total (incl GST)':m.tot,'PO Raised':m.po,Invoice:m.inv,Payment:m.pay,Date:m.date})),'Project Tracker');if(type==='all'||type==='ledger')add(S.LEDGER.map(l=>{const c=calcL(l);return{Name:l.name,Project:l.proj,Amount:l.amt,'Tax%':l.taxPct+'%','Tax Amt':c.ta,Total:c.tot,'TDS%':l.tdsPct+'%','TDS Amt':c.tdsAmt,'After TDS':c.at,'Invoice Status':l.inv,'Payment Status':l.pay,'Yet to Clear':c.ytc,Date:l.date,Remarks:l.rem};}),'Payment Ledger');if(type==='all'||type==='daily')add(S.daily.map(u=>({Person:u.who,Update:u.text,Date:u.date,Time:u.time,'Edit Count':u.eh.length})),'Daily Updates');if(type==='all')add(S.projects.map(p=>({Client:p.client,Project:p.name,Type:p.type,Status:p.status,Lead:p.lead,Editor:p.editor,Producer:p.prod,Budget:p.budget,'Progress%':p.prog,'Start Date':p.start,'Close Date':p.close})),'Projects');XLSX.writeFile(wb,type==='all'?'SugarShot_Reports_Full.xlsx':`SugarShot_${type}.xlsx`);}
/* ===================== REIMBURSEMENTS ===================== */
const RCATS={Travel:{em:'🚕',bg:'#EFF6FF',tx:'#1D4ED8'},Food:{em:'🍽️',bg:'#FFF1F0',tx:'#D93636'},Art:{em:'🎨',bg:'#FDF2F8',tx:'#BE185D'},Other:{em:'📦',bg:'#F5F3FF',tx:'#6D28D9'}};
const RST={Pending:{tx:'#B45309',bg:'#FEF3C7',bd:'#FDE68A',em:'⏳'},Approved:{tx:'#15803D',bg:'#DCFCE7',bd:'#86EFAC',em:'✅'},Rejected:{tx:'#BE123C',bg:'#FEE2E2',bd:'#FECDD3',em:'❌'},Paid:{tx:'#1D4ED8',bg:'#DBEAFE',bd:'#93C5FD',em:'💸'}};
let _rmbFile=null;
function rmbBadge(st){const s=RST[st];return`<span style="font-size:10px;font-weight:700;color:${s.tx};background:${s.bg};border:1px solid ${s.bd};border-radius:6px;padding:2.5px 8px;white-space:nowrap">${s.em} ${st}</span>`;}
function rmbCard(r,showWho){const c=RCATS[r.cat]||RCATS.Other;const canDecide=S.role==='partner'&&r.who!==S.user;const own=r.who===S.user;
  return`<div class="card" style="padding:14px 16px;margin-bottom:10px;border-left:4px solid ${RST[r.status].bd}"><div style="display:flex;align-items:flex-start;gap:12px"><div style="width:38px;height:38px;border-radius:11px;background:${c.bg};display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0">${c.em}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div style="font-weight:700;font-size:13px;color:#111827">${r.desc}</div><div style="font-size:15px;font-weight:800;color:#111827;white-space:nowrap">${fmt(r.amount)}</div></div><div style="font-size:11px;color:#9CA3AF;margin-top:2px">${r.cat} · ${r.date}${r.proj?` · 🎬 ${r.proj}`:''}${showWho?` · <span style="font-weight:700;color:#6B7280">${r.who.split(' ')[0]}</span>`:''}</div><div style="display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap">${rmbBadge(r.status)}${r.bill?(r.billUrl?`<a href="${r.billUrl}" target="_blank" style="font-size:10px;font-weight:600;color:#1D4ED8;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:6px;padding:2.5px 8px;text-decoration:none">📎 ${r.bill}</a>`:`<span style="font-size:10px;font-weight:600;color:#6B7280;background:#F3F4F6;border:1px solid #E5E7EB;border-radius:6px;padding:2.5px 8px">📎 ${r.bill}</span>`):`<span style="font-size:10px;color:#C4C4C4">no bill — total entered directly</span>`}${r.by&&r.status!=='Pending'?`<span style="font-size:10px;color:#9CA3AF">${r.status.toLowerCase()} by ${r.by.split(' ')[0]}</span>`:''}</div>${canDecide&&r.status==='Pending'?`<div style="display:flex;gap:6px;margin-top:9px"><button class="btn btnok btnsm" onclick="decRmb(${r.id},'Approved')">✔ Approve</button><button class="btn btnd btnsm" onclick="decRmb(${r.id},'Rejected')">✖ Reject</button></div>`:''}${canDecide&&r.status==='Approved'?`<div style="margin-top:9px"><button class="btn btnp btnsm" onclick="decRmb(${r.id},'Paid')">💸 Mark as Paid</button></div>`:''}${own&&r.status==='Pending'?`<div style="display:flex;gap:6px;margin-top:9px"><button class="btn btng btnsm" onclick="mARmb(${r.id})">✏️ Edit</button><button class="btn btng btnsm" onclick="dRmb(${r.id})">🗑 Withdraw</button></div>`:''}</div></div></div>`;}
function rRmb(){const my=S.reimbs.filter(r=>r.who===S.user).sort((a,b)=>b.id-a.id);const sum=(arr,st)=>arr.filter(r=>r.status===st).reduce((a,r)=>a+r.amount,0);
  const appr=sum(my,'Approved'),pend=sum(my,'Pending'),paid=sum(my,'Paid');
  const teamPend=S.reimbs.filter(r=>r.status==='Pending'&&r.who!==S.user);
  const rtab=(S.role==='partner'&&S.reimbTab==='team')?'team':'mine';
  const km=[
    {lb:'To Receive (Approved)',v:fmt(appr),ic:'💰',c:'#15803D',bg:'#F0FDF4'},
    {lb:'Awaiting Approval',v:fmt(pend),ic:'⏳',c:'#B45309',bg:'#FFFBEB'},
    {lb:'Paid Out',v:fmt(paid),ic:'💸',c:'#1D4ED8',bg:'#EFF6FF'}];
  if(S.role==='partner')km.push({lb:'Team Requests Pending',v:String(teamPend.length),ic:'🧾',c:'#6D28D9',bg:'#F5F3FF'});
  const kpis=`<div class="kpis">${km.map(m=>`<div class="kpi" style="background:${m.bg}"><div style="font-size:18px">${m.ic}</div><div style="font-size:20px;font-weight:700;margin-bottom:2px;color:${m.c}">${m.v}</div><div style="font-size:11px;opacity:.75;color:${m.c}">${m.lb}</div></div>`).join('')}</div>`;
  const tabs=S.role==='partner'?`<div class="tabs"><button class="tab${rtab==='mine'?' on':''}" onclick="S.reimbTab='mine';render()">🧾 My Claims (${my.length})</button><button class="tab${rtab==='team'?' on':''}" onclick="S.reimbTab='team';render()">✅ Approvals (${teamPend.length})</button></div>`:'';
  const list=rtab==='team'
    ?(S.reimbs.filter(r=>r.who!==S.user).sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)||b.id-a.id).map(r=>rmbCard(r,true)).join('')||`<div class="es">No team reimbursement requests yet.</div>`)
    :(my.map(r=>rmbCard(r,false)).join('')||`<div class="es">No claims yet — add your first shoot expense! 🧾</div>`);
  return kpis+tabs+list;}
function mARmb(eid){_rmbFile=null;const e=eid?S.reimbs.find(x=>x.id===eid):null;if(eid&&(!e||e.status!=='Pending'||e.who!==S.user)){alert('Only your own pending claims can be edited.');return;}sm(`<div class="mot">${e?'✏️ Edit Reimbursement':'🧾 New Reimbursement'}</div>
  <div class="fr"><div class="fg"><label class="fl">Category *</label><select class="fi" id="rm-cat">${Object.keys(RCATS).map(c=>`<option${e&&e.cat===c?' selected':''}>${c}</option>`).join('')}</select></div><div class="fg"><label class="fl">Amount (₹) *</label><input class="fi" id="rm-amt" type="number" min="1" placeholder="single bill or combined total" value="${e?e.amount:''}"></div></div>
  <div class="fg"><label class="fl">What was it for? *</label><input class="fi" id="rm-desc" placeholder="e.g. Cabs to shoot location / Crew lunch / Props" value="${e?e.desc.replace(/"/g,'&quot;'):''}"></div>
  <div class="fr"><div class="fg"><label class="fl">Date</label><input class="fi" id="rm-dt" type="date" value="${e?e.date:todayStr()}"></div><div class="fg"><label class="fl">Project (optional)</label><select class="fi" id="rm-prj"><option value="">—</option>${S.projects.filter(p=>!p.int).map(p=>`<option${e&&e.proj===p.name?' selected':''}>${p.name}</option>`).join('')}</select></div></div>
  <div class="fg"><label class="fl">${e&&e.bill?`Replace bill (current: ${e.bill}) — optional`:'Attach bill (photo / PDF) — optional'}</label><input class="fi" id="rm-bill" type="file" accept="image/*,.pdf" onchange="_rmbFile=this.files[0]?{name:this.files[0].name,url:URL.createObjectURL(this.files[0]),file:this.files[0]}:null" style="padding:7px 10px"></div>
  <div style="font-size:11px;color:#9CA3AF;margin:-4px 0 10px">No bill handy? Leave it empty and just enter the <strong>total amount</strong> — you can note "combined total" in the description.</div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbARmb(${eid||''})">${e?'Save Changes':'Submit Claim'}</button></div>`);}
function sbARmb(eid){const desc=document.getElementById('rm-desc')?.value.trim();const amt=parseInt(document.getElementById('rm-amt')?.value)||0;if(!desc){alert('Describe what the expense was for.');return;}if(amt<=0){alert('Enter the amount.');return;}
  const cat=document.getElementById('rm-cat').value,dt=document.getElementById('rm-dt').value||todayStr(),prj=document.getElementById('rm-prj').value||'';const f=_rmbFile;_rmbFile=null;S.reimbTab='mine';hm();
  if(eid){const r=S.reimbs.find(x=>x.id===eid);if(!r||r.status!=='Pending'){alert('Only pending claims can be edited.');return;}
    r.cat=cat;r.desc=desc;r.amount=amt;r.date=dt;r.proj=prj;if(f){r.bill=f.name;r.billUrl=f.url;}
    render();
    if(rmbLive){(async()=>{try{
      const up={cat:cat,descr:desc,amount:amt,date:dt,proj:prj};
      if(f&&f.file){const bp=SBuid+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');const {error:ue}=await SB.storage.from('bills').upload(bp,f.file);if(ue)throw ue;up.bill=f.name;up.bill_path=bp;r.billPath=bp;const {data:u2}=await SB.storage.from('bills').createSignedUrl(bp,3600);if(u2)r.billUrl=u2.signedUrl;}
      const {error}=await SB.from('reimbursements').update(up).eq('id',eid);if(error)throw error;
      if(S.view==='reimb')render();
    }catch(e2){alert('Edit not saved: '+(e2&&e2.message||e2));}})();}
    return;}
  if(rmbLive){(async()=>{try{
    let billName=null,billPath=null;
    if(f&&f.file){billName=f.name;billPath=SBuid+'/'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');const {error:ue}=await SB.storage.from('bills').upload(billPath,f.file);if(ue)throw ue;}
    const {data,error}=await SB.from('reimbursements').insert({user_id:SBuid,who:S.user,cat:cat,descr:desc,amount:amt,date:dt,proj:prj,bill:billName,bill_path:billPath,status:'Pending'}).select().single();
    if(error)throw error;
    if(!S.reimbs.find(r=>r.id===data.id)){const rr=mapRmb(data);if(rr.billPath){const {data:u}=await SB.storage.from('bills').createSignedUrl(rr.billPath,3600);if(u)rr.billUrl=u.signedUrl;}S.reimbs.push(rr);}
    if(S.view==='reimb')render();
  }catch(e){alert('Claim not submitted: '+(e&&e.message||e));}})();return;}
  S.reimbs.push({id:S.nid.rmb++,who:S.user,cat:cat,desc:desc,amount:amt,date:dt,proj:prj,bill:f?f.name:null,billUrl:f?f.url:null,status:'Pending',by:null});
  render();}
function decRmb(id,st){const r=S.reimbs.find(x=>x.id===id);if(!r)return;if(st==='Rejected'&&!confirm('Reject this claim?'))return;r.status=st;r.by=S.user;if(rmbLive)SB.from('reimbursements').update({status:st,decided_by:S.user}).eq('id',id).then(({error})=>{if(error)alert('Could not save the decision: '+error.message);});render();}
function dRmb(id){if(!confirm('Withdraw this claim?'))return;S.reimbs=S.reimbs.filter(x=>x.id!==id);if(rmbLive)SB.from('reimbursements').delete().eq('id',id).then(()=>{});render();}
/* --- live mode (Supabase): persistent claims + bill files in the private
   'bills' storage bucket. Falls back to demo data if server/reimb_schema.sql
   hasn't been run yet or the user isn't signed in. --- */
function mapRmb(r){return{id:r.id,who:r.who,cat:r.cat,desc:r.descr,amount:Number(r.amount),date:r.date,proj:r.proj||'',bill:r.bill||null,billPath:r.bill_path||null,billUrl:null,status:r.status,by:r.decided_by||null};}
function mapDly(r){const d=new Date(r.posted_at);return{id:r.id,who:r.author,text:r.text,date:r.day,time:d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),late:!!r.late,eh:[],exReq:r.ex_status||undefined,exReason:r.ex_reason||undefined};}
async function dailyInit(){
  if(!SB||!SBuid)return;
  try{
    const {data,error}=await SB.from('daily_updates').select('*').order('id',{ascending:false});
    if(error)throw error;
    S.daily=(data||[]).map(mapDly);
    dailyLive=true;
    SB.channel('daily-stream')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'daily_updates'},p=>{if(!S.daily.find(x=>x.id===p.new.id)){S.daily.unshift(mapDly(p.new));if(S.view==='daily'||S.view==='dash')render();}})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'daily_updates'},p=>{const u=S.daily.find(x=>x.id===p.new.id);if(u){u.exReq=p.new.ex_status||undefined;u.exReason=p.new.ex_reason||undefined;if(S.view==='daily'||S.view==='dash')render();}})
      .subscribe();
    if(S.view==='daily'||S.view==='dash')render();

  }catch(e){console.warn('Daily updates: live mode unavailable ('+(e&&e.message||e)+') — using demo data. Run server/daily_schema.sql in Supabase if you have not yet.');}
}
async function rmbInit(){
  if(!SB||!SBuid)return;
  try{
    const {data,error}=await SB.from('reimbursements').select('*').order('id');
    if(error)throw error;
    S.reimbs=(data||[]).map(mapRmb);
    rmbLive=true;
    const paths=S.reimbs.filter(r=>r.billPath).map(r=>r.billPath);
    if(paths.length){const {data:su}=await SB.storage.from('bills').createSignedUrls(paths,3600);(su||[]).forEach(u=>{if(u.signedUrl){const rr=S.reimbs.find(r=>r.billPath===u.path);if(rr)rr.billUrl=u.signedUrl;}});}
    SB.channel('reimb-stream')
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'reimbursements'},async p=>{if(!S.reimbs.find(r=>r.id===p.new.id)){const rr=mapRmb(p.new);if(rr.billPath){const {data:u}=await SB.storage.from('bills').createSignedUrl(rr.billPath,3600);if(u)rr.billUrl=u.signedUrl;}S.reimbs.push(rr);if(S.view==='reimb')render();}})
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'reimbursements'},p=>{const rr=S.reimbs.find(r=>r.id===p.new.id);if(rr){rr.status=p.new.status;rr.by=p.new.decided_by||rr.by;rr.cat=p.new.cat;rr.desc=p.new.descr;rr.amount=Number(p.new.amount);rr.date=p.new.date;rr.proj=p.new.proj||'';rr.bill=p.new.bill||rr.bill;if(S.view==='reimb')render();}})
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'reimbursements'},p=>{const i=S.reimbs.findIndex(r=>r.id===(p.old||{}).id);if(i>-1){S.reimbs.splice(i,1);if(S.view==='reimb')render();}})
      .subscribe();
    if(S.view==='reimb')render();
    console.log('Reimbursements: LIVE mode');
  }catch(e){console.warn('Reimbursements: live mode unavailable ('+(e&&e.message||e)+') — using demo data. Run server/reimb_schema.sql in Supabase if you have not yet.');}
}

function rLv(){const myLv=S.leaves.filter(l=>l.who===S.user);const othersApproved=S.leaves.filter(l=>l.who!==S.user&&l.status==='Approved');const toShow=S.role==='partner'?S.leaves:[...myLv,...othersApproved];const pending=S.leaves.filter(l=>l.status==='Pending');const lc=st=>st==='Approved'?'#4ADE80':st==='Rejected'?'#FB7185':'#FCD34D';const lbg=st=>st==='Approved'?'#D1FAE5':st==='Rejected'?'#FEE2E2':'#FEF3C7';const ltx=st=>st==='Approved'?'#15803D':st==='Rejected'?'#BE123C':'#92400E';return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:14px;font-weight:700;color:#111827">🌴 Leave Management</div><div style="font-size:12px;color:#9CA3AF;margin-top:2px">${S.role==='partner'?'Partner view — all team leaves visible':'Your leaves + approved team leaves'}</div></div><button class="btn btnp" onclick="mReqLv()">+ Request Leave</button></div>${(()=>{const el=compEarnedList(S.user);const used=compUsed(S.user);const av=compAvail(S.user);return`<div class="card" style="padding:12px 16px;margin-bottom:12px;border-left:4px solid ${av?'#4ADE80':'#D1D5DB'};background:${av?'#F0FDF4':'#FAFAFA'}"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><div style="font-size:12.5px;font-weight:700;color:${av?'#15803D':'#6B7280'}">🎁 Comp Offs — ${av} day${av!==1?'s':''} available</div><div style="font-size:11px;color:#9CA3AF;margin-top:2px">${el.length?`Earned ${el.length} for working Sundays/holidays (${el.join(', ')})${used?` · ${used} used`:''}`:'Post a daily update on a Sunday or public holiday to earn a comp off.'}</div></div>${av?`<button class="btn btnok btnsm" onclick="mReqLv()">Use Comp Off →</button>`:''}</div></div>`;})()}${S.role==='partner'?`<div class="card" style="padding:12px 16px;margin-bottom:12px"><div class="ct" style="margin-bottom:8px">🎁 Team Comp Offs</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px">${USERS.map(n2=>{const av2=compAvail(n2),el2=compEarnedList(n2),us2=compUsed(n2);return`<div title="${el2.length?'Earned '+el2.length+': '+el2.join(', ')+(us2?' · used '+us2:''):'No comp offs earned yet'}" style="display:flex;align-items:center;gap:8px;background:#F8F8FF;border-radius:9px;padding:7px 10px"><div class="mav" style="background:${avcol(n2)};width:24px;height:24px;font-size:9px">${ini(n2)}</div><span style="font-size:12px;font-weight:600;flex:1">${n2.split(' ')[0]}</span><span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:${av2?'#DCFCE7':'#F3F4F6'};color:${av2?'#15803D':'#9CA3AF'}">${av2}</span></div>`;}).join('')}</div><div style="font-size:10px;color:#9CA3AF;margin-top:8px">Earned by posting a daily update on a Sunday / public holiday · hover a person for the dates</div></div>`:''}${S.role==='partner'&&pending.length?`<div style="background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:10px;padding:12px 14px;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:#92400E">⏳ ${pending.length} leave request${pending.length>1?'s':''} pending your approval</span></div>`:''}${toShow.length===0?`<div class="es">No leaves to display</div>`:''}${toShow.map(l=>{const days=Math.round((new Date(l.to)-new Date(l.from))/86400000)+1;return`<div class="lv-card" style="border-left-color:${lc(l.status)}"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="mav" style="background:${avcol(l.who)};width:30px;height:30px;font-size:10px">${ini(l.who)}</div><span style="font-weight:700;font-size:14px">${l.who}</span></div><div style="font-size:12px;color:#374151;margin-left:38px"><strong>${l.type}</strong> · ${l.from}${l.from!==l.to?' → '+l.to:''} · <strong>${days} day${days>1?'s':''}</strong></div></div><span class="badge" style="background:${lbg(l.status)};color:${ltx(l.status)}">${l.status}</span></div><div style="font-size:13px;color:#6B7280;margin-left:38px">${l.reason}</div>${l.notes?`<div style="font-size:11px;color:#9CA3AF;margin-left:38px;margin-top:2px">Note: ${l.notes}</div>`:''}${l.approvedBy?`<div style="font-size:10px;color:#9CA3AF;margin-left:38px;margin-top:3px">✓ ${l.status} by ${l.approvedBy}</div>`:''}${l.status==='Pending'&&S.role==='partner'?`<div style="display:flex;gap:8px;margin-top:10px;margin-left:38px"><button class="btn btnok btnsm" onclick="appLv(${l.id})">✅ Approve</button><button class="btn btnd btnsm" onclick="rejLv(${l.id})">✕ Reject</button></div>`:''}  </div>`;}).join('')}`;}

function sbLv(isEmp){const fr=document.getElementById('lv-fr')?.value,to=document.getElementById('lv-to')?.value,rs=document.getElementById('lv-rs')?.value.trim();if(!fr||!to||!rs){alert('Fill all required fields.');return;}if(to<fr){alert('End date cannot be before start date.');return;}const days=Math.round((new Date(to)-new Date(fr))/86400000)+1;const who=isEmp?S.user:document.getElementById('lv-who')?.value||S.user;const ty=document.getElementById('lv-ty')?.value||LTYPES[0];if(ty==='Comp Off'&&days>compAvail(who)){alert(who.split(' ')[0]+' has only '+compAvail(who)+' comp off day(s) available (earned by working Sundays/holidays).');return;}S.leaves.unshift({id:S.nid.lv++,who,type:ty,from:fr,to,days,reason:rs,status:'Pending',approvedBy:'',notes:document.getElementById('lv-nt')?.value||''});hm();render();}

    const [{data:chans,error:e1},{data:msgs,error:e2},{data:rxs,error:e3}]=await Promise.all([

      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_reactions'},p=>{const r=p.new;const m=findLiveMsg(r.message_id);if(m){if(!m.rx[r.emoji])m.rx[r.emoji]=[];if(!m.rx[r.emoji].includes(r.author)){m.rx[r.emoji].push(r.author);if(S.view==='chat')render();}}})

      .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_channels'},p=>{const c=p.new;if(!S.chs.find(x=>x.id===c.id)){S.chs.push({id:c.id,name:c.name,members:c.members||[],msgs:[]});if(S.view==='chat')render();}})

}

sm" onclick="S.pipeSnap='monthly';render()">July 2026</button><button class="tab${S.pipeSnap==='fy'?' on':''} btnsm" onclick="S.pipeSnap='fy';render()">FY 26-27</button></div></div><div style="font-size:11px;color:#9CA3AF;margin-bottom:10px">${S.pipeSnap==='monthly'?'July 2026':'April 2026 – March 2027'}</div>${[{lb:'Total Deals',v:snap.length,sub:fmt(snap.reduce((s,c)=>s+c.value,0))},{lb:'Won / WIP / Closed',v:snapWon.length,sub:fmt(snapWon.reduce((s,c)=>s+c.value,0))},{lb:'In Pipeline',v:snap.filter(c=>['ENQUIRIES','ESTIMATE SENT'].includes(c.status)).length,sub:fmt(snap.filter(c=>['ENQUIRIES','ESTIMATE SENT'].includes(c.status)).reduce((s,c)=>s+c.value,0))},{lb:'Lost',v:snapLost.length,sub:fmt(snapLost.reduce((s,c)=>s+c.value,0))}].map(m=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#F8F8FF;border-radius:8px;margin-bottom:4px"><span style="font-size:12px">${m.lb}</span><div style="text-align:right"><div style="font-size:13px;font-weight:700">${m.v}</div><div style="font-size:10px;color:#9CA3AF">${m.sub}</div></div></div>`).join('')}</div></div></div>`;}

const COLPAL=[{bg:'#F0F9FF',bd:'#38BDF8',tx:'#0369A1'},{bg:'#FEFCE8',bd:'#EAB308',tx:'#A16207'},{bg:'#FDF2F8',bd:'#F472B6',tx:'#BE185D'},{bg:'#ECFDF5',bd:'#34D399',tx:'#047857'},{bg:'#EEF2FF',bd:'#818CF8',tx:'#4338CA'},{bg:'#FFF7ED',bd:'#FB923C',tx:'#C2410C'}];
function addCol(){const n=(prompt('New column name (e.g. Pre-Production, Shoot, Editing)')||'').trim();if(!n)return;const key=n.toUpperCase();if(COLS.includes(key)){alert('That column already exists.');return;}const col=COLPAL[COLS.length%COLPAL.length];CC[key]={bg:col.bg,bd:col.bd,tx:col.tx,em:'📌'};COLS.push(key);render();}
function renameCol(old){const nn=(prompt('Rename column',old)||'').trim();if(!nn)return;const key=nn.toUpperCase();if(key===old)return;if(COLS.includes(key)){alert('A column with that name already exists.');return;}const i=COLS.indexOf(old);if(i<0)return;COLS[i]=key;CC[key]=CC[old];delete CC[old];S.cards.forEach(c=>{if(c.status===old)c.status=key;});render();}
function delCol(name){const i=COLS.indexOf(name);if(i<0)return;if(COLS.length<=1){alert('You need at least one column.');return;}const has=S.cards.filter(c=>!c.del&&c.status===name);const dest=COLS.find(x=>x!==name);if(has.length){if(!confirm(has.length+' deal(s) in "'+name+'" will move to "'+dest+'". Delete this column?'))return;}else if(!confirm('Delete column "'+name+'"?'))return;has.forEach(c=>c.status=dest);COLS.splice(i,1);delete CC[name];render();}
function rCRM(){const arch=S.cards.filter(c=>!c.del&&c.arch);return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:12px;color:#6B7280">Drag · Right-click for options · Double-click WIP to open project</div>${S.role==='partner'?`<div style="display:flex;gap:8px"><button class="btn btng btnsm" onclick="S.crmArch=!S.crmArch;render()">${S.crmArch?'🙈 Hide':'📦 Archived ('+arch.length+')'}</button><button class="btn btnp btnsm" onclick="addCol()">➕ Add Column</button></div>`:''}</div><div class="kbn">${COLS.map(col=>{const c=CC[col];const cards=S.cards.filter(x=>!x.del&&!x.arch&&x.status===col);return`<div class="kcol" style="background:${c.bg};border:1.5px solid ${c.bd}30" ondragover="event.preventDefault()" ondrop="doDrop(event,'${col}')"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${c.tx}">${c.em} ${col}</span><span style="display:flex;align-items:center;gap:4px">${S.role==='partner'?`<span onclick="renameCol('${col.replace(/'/g,"\\'")}')" title="Rename column" style="cursor:pointer;font-size:11px;opacity:.55">✏️</span><span onclick="delCol('${col.replace(/'/g,"\\'")}')" title="Delete column" style="cursor:pointer;font-size:11px;opacity:.55">🗑️</span>`:''}<span style="font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;background:${c.bd}25;color:${c.tx}">${cards.length}</span></span></div><div style="font-size:11px;font-weight:600;margin-bottom:8px;color:${c.tx}">${fmt(cards.reduce((s,c2)=>s+c2.value,0))}</div>${cards.map(card=>`<div class="kcard" style="border-left-color:${c.bd}" draggable="true" ondragstart="S.drag.id=${card.id}" ondblclick="${card.status==='WIP'?`opFC(${card.id})`:`mEC(${card.id})`}" oncontextmenu="rCtx(event,${card.id})"><div style="font-weight:700;font-size:12px;color:#111827">${card.client}</div><div style="font-size:11px;color:#9CA3AF;margin:1px 0 6px">${card.project}</div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;font-weight:700;color:${c.tx}">${fmt(card.value)}</span><span style="font-size:9px;background:#F3F4F6;color:#555;border-radius:4px;padding:2px 5px">${card.poc.split(' ')[0]}</span></div><div style="font-size:9px;color:#C4C4C4;margin-top:3px">📅 ${card.date}</div>${card.notes?`<div style="font-size:9px;color:#6B7280;margin-top:2px;font-style:italic">${card.notes}</div>`:''}</div>`).join('')}<div style="min-height:28px;border-radius:6px;border:2px dashed ${c.bd}20;margin-top:4px"></div></div>`;}).join('')}</div>${S.crmArch&&arch.length?`<div class="ab" style="margin-top:12px">📦 Archived — in reports, removed from pipeline</div><div style="display:flex;flex-wrap:wrap;gap:8px">${arch.map(card=>`<div style="background:#fff;border-radius:8px;padding:10px;min-width:155px;border-left:3px solid #9CA3AF;box-shadow:0 1px 3px rgba(0,0,0,.07)"><div style="font-weight:700;font-size:12px">${card.client}</div><div style="font-size:11px;color:#9CA3AF;margin-bottom:4px">${card.project}</div><div style="font-size:11px;font-weight:700;color:#6B7280">${fmt(card.value)}</div>${S.role==='partner'?`<div style="display:flex;gap:4px;margin-top:6px"><button class="btn btng btnsm" onclick="S.cards.find(c=>c.id===${card.id}).arch=false;render()">↩</button><button class="btn btnd btnsm" onclick="dCard(${card.id})">🗑</button></div>`:''}</div>`).join('')}</div>`:''}`;}
function doDrop(e,col){e.preventDefault();if(!S.drag.id)return;const card=S.cards.find(c=>c.id===S.drag.id);if(!card)return;if(col==='CLOSED'&&!confirm('Confirm completion?')){S.drag.id=null;return;}card.status=col;if(col==='WON')conf();syncWIP();const m=S.MASTER.find(x=>x.cardId===card.id);if(m)m.status=col==='CLOSED'?'Completed':col==='WON'?'Won':'In Progress';S.drag.id=null;render();}

// Keeps the Project Manager in sync with the CRM pipeline: any card in WIP or
// CLOSED gets a matching project (created once, tracked by card id `cid`), and
// its project status follows the card — WIP card -> WIP project, CLOSED card ->
// Closed project (100% + closed date).
function syncWIP(){S.cards.filter(c=>!c.del&&(c.status==='WIP'||c.status==='CLOSED')).forEach(card=>{let p=S.projects.find(p=>p.cid===card.id);if(!p){p={id:S.nid.proj++,cid:card.id,client:card.client,name:card.project,lead:card.poc,lead2:'',prod:'',post:'',editor:'',start:card.date,estart:'',close:'',prog:0,budget:card.value,status:'WIP',int:false,type:'Brand Film',upds:[],sc:null,closed:null};S.projects.push(p);}if(card.status==='CLOSED'){if(p.status!=='CLOSED'){p.status='CLOSED';p.prog=100;if(!p.closed)p.closed=card.date||new Date().toISOString().split('T')[0];}}else if(p.status==='CLOSED'){p.status='WIP';p.closed=null;}});}
function mAC(){sm(`<div class="mot">➕ Add New Deal</div><div class="fr"><div class="fg"><label class="fl">Client Name *</label><input class="fi" id="fc-cli"></div><div class="fg"><label class="fl">Project Name *</label><input class="fi" id="fc-prj"></div></div><div class="fr"><div class="fg"><label class="fl">Value (₹) *</label><input class="fi" id="fc-val" type="number"></div><div class="fg"><label class="fl">Internal POC *</label><select class="fi" id="fc-poc">${uopts('Anirudh Venkatachalam')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Reference</label><input class="fi" id="fc-ref" placeholder="Name or Existing Client"></div><div class="fg"><label class="fl">Date *</label><input class="fi" id="fc-dt" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="fr"><div class="fg"><label class="fl">Stage</label><select class="fi" id="fc-st">${COLS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="fg"><label class="fl">Notes</label><input class="fi" id="fc-nt"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAC()">Add Deal</button></div>`);}
function sbAC(){const cli=document.getElementById('fc-cli').value.trim(),prj=document.getElementById('fc-prj').value.trim();if(!cli||!prj){alert('Client and project required.');return;}const st=document.getElementById('fc-st').value;S.cards.push({id:S.nid.card++,client:cli,project:prj,value:parseInt(document.getElementById('fc-val').value)||0,poc:document.getElementById('fc-poc').value,ref:document.getElementById('fc-ref').value.trim()||'New',date:document.getElementById('fc-dt').value,status:st,arch:false,del:false,notes:document.getElementById('fc-nt').value.trim()});if(st==='WON')conf();syncWIP();hm();render();}

function rPL(){syncWIP();const wip=S.projects.filter(p=>p.status==='WIP');const cls=S.projects.filter(p=>p.status==='CLOSED').sort((a,b)=>(b.closed||'').localeCompare(a.closed||''));const showCls=S.projClosedAll?cls:cls.slice(0,4);return`<div class="tabs"><button class="tab${S.projTab==='wip'?' on':''}" onclick="S.projTab='wip';render()">🔨 WIP (${wip.length})</button><button class="tab${S.projTab==='closed'?' on':''}" onclick="S.projTab='closed';render()">✅ Closed (${cls.length})</button></div>${S.projTab==='wip'?`<div class="pgrid">${wip.map(p=>{const pb=p.prog>70?'#4ADE80':p.prog>40?'#FCD34D':'#FB7185';const pc=p.prog>70?'#15803D':p.prog>40?'#B45309':'#BE123C';return`<div class="psq" style="border-top-color:${pb}" onclick="S.selProj=S.projects.find(x=>x.id===${p.id});S.viewAll=false;render()"><div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:${pc};margin-bottom:3px">${p.client}</div><div style="font-size:13px;font-weight:700;color:#111827;margin-bottom:8px;line-height:1.3">${p.name}</div><div class="pt"><div class="pf2" style="width:${p.prog}%;background:${pb}"></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;font-weight:700;color:${pc}">${p.prog}%</span><span style="font-size:11px;font-weight:700;color:#7C3AED">${fmt(p.budget)}</span></div><div style="font-size:10px;color:#9CA3AF">👑 ${p.lead.split(' ')[0]} ${p.lead2?'/ '+p.lead2.split(' ')[0]:''}</div><div style="font-size:10px;color:#9CA3AF">✂️ ${p.editor||'—'}</div><div style="font-size:10px;color:#9CA3AF">📅 ${p.close||'—'}</div><div style="font-size:10px;color:#60A5FA;margin-top:6px">${p.upds.length} update${p.upds.length!==1?'s':''}</div></div>`;}).join('')||`<div class="es">No active projects</div>`}</div>`:`<div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">${showCls.map(p=>`<div style="background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);cursor:pointer;border-top:4px solid #A78BFA" onclick="S.selProj=S.projects.find(x=>x.id===${p.id});S.viewAll=false;render()"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#6D28D9;letter-spacing:.5px">${p.client}</div><div style="font-size:14px;font-weight:700;color:#111827;margin:2px 0 6px;line-height:1.3">${p.name}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:#9CA3AF"><span>Closed ${p.closed||'—'}</span><span style="font-weight:700;color:#7C3AED">${fmt(p.budget)}</span></div>${p.sc?`<div style="margin-top:6px;font-size:11px;color:#F59E0B">${'★'.repeat(Math.round(Object.values(p.sc.scores).reduce((a,b)=>a+b,0)/4))} Editor rated</div>`:''}</div>`).join('')}</div>${cls.length>4?`<button class="btn btng btnsm" style="width:100%" onclick="S.projClosedAll=!S.projClosedAll;render()">${S.projClosedAll?'Show Recent ↑':'View All '+cls.length+' Closed ↓'}</button>`:``}${cls.length===0?`<div class="es">No closed projects yet</div>`:''}</div>`}`;} 
function rPD(){const p=S.selProj;if(!p)return'';const pb=p.prog>70?'#4ADE80':p.prog>40?'#FCD34D':'#FB7185';const pc=p.prog>70?'#15803D':p.prog>40?'#B45309':'#BE123C';const canCtrl=S.role==='partner'||S.user===p.lead;const canUpd=canCtrl||[p.editor,p.lead2,p.prod,p.post].includes(S.user);const sorted=[...p.upds].sort((a,b)=>b.id-a.id);const vis=S.viewAll?sorted:sorted.slice(0,5);return`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn btng btnsm" onclick="S.selProj=null;render()">← Back</button>${canCtrl&&p.status==='WIP'?`<button class="btn btnp btnsm" onclick="closeP(${p.id})">✅ Close Project</button><button class="btn btng btnsm" onclick="mEP(${p.id})">✏️ Edit</button>`:''}</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px"><div><div style="font-size:10px;color:#7C3AED;font-weight:700;text-transform:uppercase">${p.client}${p.int?' · Internal':''}</div><div style="font-size:20px;font-weight:700;color:#111827">${p.name}</div><div style="color:#9CA3AF;font-size:12px;margin-top:2px">Budget: <strong style="color:#7C3AED">${fmt(p.budget)}</strong> · ${p.type}</div></div><span class="badge" style="background:${p.status==='WIP'?'#EFF6FF':'#F0FDF4'};color:${p.status==='WIP'?'#1D4ED8':'#15803D'}">${p.status}</span></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">${[['👑 Lead',p.lead],['🤝 2nd Lead',p.lead2||'—'],['🎬 Producer',p.prod||'—'],['🎞️ Post',p.post||'—'],['✂️ Editor',p.editor||'—'],['📅 Due',p.close||'—']].map(([l,v])=>`<div style="background:#F8F8FF;border-radius:6px;padding:6px 9px"><div style="font-size:9px;color:#9CA3AF;margin-bottom:1px">${l}</div><div style="font-size:11px;font-weight:600">${v}</div></div>`).join('')}</div><div style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:13px;font-weight:700">📈 Progress</span><span style="font-size:14px;font-weight:700;color:${pc}" id="pp${p.id}">${p.prog}%</span></div><div class="pt" id="pt${p.id}" style="height:12px;${canCtrl?'cursor:pointer':''}" ${canCtrl?`onmousedown="pDown(event,${p.id})"`:''}><div class="pf2" id="pf${p.id}" style="width:${p.prog}%;background:${pb}"></div>${canCtrl?`<div class="ph2" id="ph${p.id}" style="left:${p.prog}%;background:${pb}"></div>`:''}</div>${canCtrl?`<div style="font-size:10px;color:#9CA3AF;margin-top:3px">Drag to update progress</div>`:''}</div><div><div style="font-size:13px;font-weight:700;margin-bottom:10px">📋 Project Updates</div>${canUpd?`<div style="display:flex;gap:8px;margin-bottom:12px"><input class="fi" id="ui${p.id}" placeholder="Add an update..." style="flex:1;padding:8px 12px"><button class="btn btnp btnsm" onclick="addU(${p.id})">Post</button></div>`:''}${vis.map(u=>`<div class="ui" style="background:#F8F8FF;border-left-color:#60A5FA"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:7px"><div class="mav" style="background:${avcol(u.who)};width:26px;height:26px;font-size:10px">${ini(u.who)}</div><span style="font-weight:700">${u.who}</span></div><span style="font-size:10px;color:#9CA3AF">${u.date} ${u.time}</span></div><div style="font-size:13px;color:#374151;margin-top:5px">${u.text}</div>${u.eh&&u.eh.length?`<div class="eh">Edited ${u.eh.length}x</div>`:''}</div>`).join('')||'<div style="text-align:center;color:#9CA3AF;padding:20px;font-size:12px">No updates yet</div>'}${!S.viewAll&&sorted.length>5?`<button class="btn btng btnsm" style="width:100%;margin-top:8px" onclick="S.viewAll=true;render()">View All ${sorted.length} ↓</button>`:''}${S.viewAll&&sorted.length>5?`<button class="btn btng btnsm" style="width:100%;margin-top:8px" onclick="S.viewAll=false;render()">Show Less ↑</button>`:''}</div></div>${p.status==='CLOSED'&&!p.sc&&(S.role==='partner'||S.user===p.lead)?`<div class="sc"><div style="font-size:15px;font-weight:700;color:#92400E;margin-bottom:12px">⭐ Rate Editor — ${p.editor||'(none)'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${['Creativity','Deadline Adherence','Project Updates','Export Quality'].map((cat,ci)=>`<div><div style="font-size:12px;color:#92400E;margin-bottom:4px">${cat}</div><div class="sr" id="sr${ci}">${[1,2,3,4,5].map(n=>`<span class="st" onclick="rSt(${ci},${n})">★</span>`).join('')}</div></div>`).join('')}</div><div class="fg" style="margin-top:12px"><label class="fl" style="color:#92400E">Feedback</label><textarea class="fi" id="sc-fb" rows="2" placeholder="Overall feedback..."></textarea></div><button class="btn btnp" style="margin-top:10px;background:#D97706;width:100%" onclick="sbSc(${p.id})">Submit Rating</button></div>`:''}${p.sc?`<div style="background:#F0FDF4;border:1px solid #86EFAC;border-radius:10px;padding:14px;margin-top:12px"><div style="font-weight:700;color:#15803D;margin-bottom:8px">⭐ Editor Score — ${p.editor}</div>${Object.entries(p.sc.scores).map(([cat,s])=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>${cat}</span><span style="color:#F59E0B">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span></div>`).join('')}${p.sc.fb?`<div style="font-size:12px;color:#374151;margin-top:8px;font-style:italic">"${p.sc.fb}"</div>`:''}<div style="font-size:10px;color:#9CA3AF;margin-top:6px">Rated by ${p.sc.by}</div></div>`:''}`;} 
function rSt(ci,n){S.starR[ci]=n;const row=document.getElementById('sr'+ci);if(row)row.querySelectorAll('.st').forEach((s,i)=>{s.className='st'+(i<n?' f':'');});}
function sbSc(pid){const cats=['Creativity','Deadline Adherence','Project Updates','Export Quality'];const scores={};cats.forEach((c,i)=>scores[c]=S.starR[i]||0);const p=S.projects.find(x=>x.id===pid);if(p){p.sc={scores,fb:document.getElementById('sc-fb')?.value||'',by:S.user,date:new Date().toISOString().split('T')[0]};}S.starR={};render();}
function closeP(pid){if(!confirm('Close this project?'))return;const p=S.projects.find(x=>x.id===pid);if(!p)return;p.status='CLOSED';p.closed=new Date().toISOString().split('T')[0];S.projTab='closed';render();}
function addU(pid){const inp=document.getElementById('ui'+pid);const txt=inp?.value.trim();if(!txt)return;const p=S.projects.find(x=>x.id===pid);if(!p)return;const now=new Date();p.upds.push({id:S.nid.upd++,who:S.user,text:txt,date:now.toISOString().split('T')[0],time:now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),eh:[]});inp.value='';render();}
let pAct=false,pPid=null;
function pDown(e,pid){pAct=true;pPid=pid;pMov(e,pid);e.preventDefault();}
document.addEventListener('mousemove',e=>{if(pAct&&pPid)pMov(e,pPid);});
document.addEventListener('mouseup',()=>{pAct=false;pPid=null;});
function pMov(e,pid){const tr=document.getElementById('pt'+pid);if(!tr)return;const r=tr.getBoundingClientRect();const pct=Math.max(0,Math.min(100,Math.round((e.clientX-r.left)/r.width*100)));const p=S.projects.find(x=>x.id===pid);if(p)p.prog=pct;const pb=pct>70?'#4ADE80':pct>40?'#FCD34D':'#FB7185';const f=document.getElementById('pf'+pid),h=document.getElementById('ph'+pid),lb=document.getElementById('pp'+pid);if(f){f.style.width=pct+'%';f.style.background=pb;}if(h){h.style.left=pct+'%';h.style.background=pb;}if(lb)lb.textContent=pct+'%';}
function mAP(){sm(`<div class="mot">🎬 New Project</div><div class="fr"><div class="fg"><label class="fl">Client *</label><input class="fi" id="ap-cli"></div><div class="fg"><label class="fl">Project Name *</label><input class="fi" id="ap-nm"></div></div><div class="fr"><div class="fg"><label class="fl">Type</label><select class="fi" id="ap-ty">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fg"><label class="fl">Budget (₹)</label><input class="fi" id="ap-bud" type="number"></div></div><div class="fr"><div class="fg"><label class="fl">Project Lead *</label><select class="fi" id="ap-ld">${uopts('')}</select></div><div class="fg"><label class="fl">2nd Lead</label><select class="fi" id="ap-l2">${uoptsB('')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Producer</label><select class="fi" id="ap-pr">${uoptsB('')}</select></div><div class="fg"><label class="fl">Post Producer</label><select class="fi" id="ap-pp">${uoptsB('')}</select></div></div><div class="fr"><div class="fg"><label class="fl">Editor</label><select class="fi" id="ap-ed">${uoptsB('')}</select></div><div class="fg"><label class="fl">Start Date</label><input class="fi" id="ap-st" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="fr"><div class="fg"><label class="fl">Edit Start</label><input class="fi" id="ap-es" type="date"></div><div class="fg"><label class="fl">Close Date</label><input class="fi" id="ap-cl" type="date"></div></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAP(false)">Add Project</button></div>`);}

function sbAP(isInt){const nm=(isInt?document.getElementById('ai-nm'):document.getElementById('ap-nm'))?.value.trim();if(!nm){alert('Name required.');return;}const now=new Date().toISOString().split('T')[0];const nt=isInt?document.getElementById('ai-nt')?.value.trim():'';S.projects.push({id:S.nid.proj++,cid:null,client:isInt?'Internal':document.getElementById('ap-cli')?.value.trim()||'',name:nm,lead:isInt?document.getElementById('ai-ld')?.value:document.getElementById('ap-ld')?.value||'',lead2:isInt?'':document.getElementById('ap-l2')?.value||'',prod:isInt?'':document.getElementById('ap-pr')?.value||'',post:isInt?'':document.getElementById('ap-pp')?.value||'',editor:isInt?'':document.getElementById('ap-ed')?.value||'',start:isInt?now:document.getElementById('ap-st')?.value||now,estart:isInt?'':document.getElementById('ap-es')?.value||'',close:isInt?document.getElementById('ai-cl')?.value||'':document.getElementById('ap-cl')?.value||'',prog:0,budget:isInt?0:parseInt(document.getElementById('ap-bud')?.value)||0,status:'WIP',int:isInt,type:isInt?'Internal':document.getElementById('ap-ty')?.value||'Brand Film',upds:nt?[{id:S.nid.upd++,who:S.user,text:nt,date:now,time:'',eh:[]}]:[],sc:null,closed:null});hm();render();}

function sbEP(pid){const p=S.projects.find(x=>x.id===pid);if(!p)return;p.client=document.getElementById('ep-cli').value||p.client;p.name=document.getElementById('ep-nm').value||p.name;p.lead=document.getElementById('ep-ld').value||p.lead;p.editor=document.getElementById('ep-ed').value;p.close=document.getElementById('ep-cl').value||p.close;p.budget=parseInt(document.getElementById('ep-bud').value)||p.budget;hm();render();}

function rDaily(){const today='2026-07-04';const tod=S.daily.filter(u=>u.date===today);const older=S.daily.filter(u=>u.date!==today);const mine=tod.find(u=>u.who===S.user);const calSt={1:'done',2:'miss',3:'done',4:'today'};const calCell=d=>{const s=calSt[d]||(d<4?'miss':'future');if(s==='done')return`<div style="aspect-ratio:1;border-radius:9px;background:#DCFCE7;border:1.5px solid #4ADE80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><div style="font-size:9px;font-weight:700;color:#15803D">${d}</div><div style="font-size:12px;line-height:1">✅</div></div>`;if(s==='miss')return`<div style="aspect-ratio:1;border-radius:9px;background:#FEE2E2;border:1.5px solid #FB7185;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><div style="font-size:9px;font-weight:700;color:#BE123C">${d}</div><div style="font-size:12px;line-height:1">❌</div></div>`;if(s==='ex')return`<div style="aspect-ratio:1;border-radius:9px;background:#F3F4F6;border:1.5px solid #D1D5DB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><div style="font-size:9px;font-weight:700;color:#9CA3AF">${d}</div><div style="font-size:11px;line-height:1;color:#9CA3AF">⚫</div></div>`;if(s==='today')return`<div style="aspect-ratio:1;border-radius:9px;background:#FFF7ED;border:2px solid #F97316;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px"><div style="font-size:9px;font-weight:700;color:#C2410C">${d}</div><div style="font-size:9px;line-height:1;color:#F97316;font-weight:700">NOW</div></div>`;return`<div style="aspect-ratio:1;border-radius:9px;background:#F9FAFB;border:1px solid #F3F4F6;display:flex;align-items:center;justify-content:center"><div style="font-size:9px;font-weight:600;color:#D1D5DB">${d}</div></div>`;};return`<div class="g2"><div>${!mine?`<div class="card" style="border:2px solid #FB923C"><div class="ct">📝 Your Daily Update</div><textarea class="fi" id="di" rows="3" placeholder="What did you work on today?" style="resize:vertical;margin-bottom:8px;width:100%"></textarea><button class="btn btnp" onclick="sbDly()">Submit Update</button></div>`:`<div class="card" style="border:2px solid #4ADE80"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="ct" style="margin:0">✅ Your Update Today</div><button class="btn btng btnsm" onclick="mED(${mine.id})">✏️ Edit</button></div><div style="color:#374151;font-size:13px">${mine.text}</div><div style="font-size:10px;color:#9CA3AF;margin-top:5px">${mine.time}${mine.eh.length?` · Edited ${mine.eh.length}x`:''}</div></div>`}<div class="card"><div class="ct">📅 July 2026 — Attendance</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px">${['S','M','T','W','T','F','S'].map(d=>`<div style="text-align:center;font-size:9px;font-weight:700;color:#9CA3AF;padding-bottom:4px">${d}</div>`).join('')}<div></div><div></div><div></div>${Array.from({length:31},(_,i)=>calCell(i+1)).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap">${[['#DCFCE7','#4ADE80','✅ Done'],['#FEE2E2','#FB7185','❌ Missed'],['#F3F4F6','#D1D5DB','⚫ Exempt']].map(([bg,bd,lb])=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px"><div style="width:20px;height:16px;border-radius:4px;background:${bg};border:1.5px solid ${bd}"></div><span style="color:#666">${lb}</span></div>`).join('')}</div></div></div><div><div class="card" style="max-height:440px;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="ct" style="margin:0">👥 Team Updates — Today</div><span style="font-size:11px;color:#9CA3AF">${tod.length} / ${USERS.length} submitted</span></div>${USERS.map(name=>{const upd=tod.find(u=>u.who===name);return`<div class="ui" style="background:#F8F8FF;border-left-color:${upd?'#4ADE80':'#FEE2E2'}"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:7px"><div class="mav" style="background:${avcol(name)};width:27px;height:27px;font-size:10px">${ini(name)}</div><span style="font-weight:700">${name}</span></div><div style="display:flex;align-items:center;gap:6px"><span style="font-size:18px">${upd?'✅':'⏳'}</span>${upd&&upd.who===S.user?`<button class="btn btng btnsm" style="padding:2px 8px;font-size:10px" onclick="mED(${upd.id})">✏️</button>`:''}</div></div>${upd?`<div style="font-size:13px;color:#374151;margin-top:4px">${upd.text}</div><div style="font-size:10px;color:#9CA3AF;margin-top:2px">${upd.time}${upd.eh.length?` · Edited ${upd.eh.length}x`:''}</div>`:''}</div>`;}).join('')}${older.length?`<div style="border-top:1px solid #F3F4F6;margin-top:12px;padding-top:12px"><div class="ct">📅 Previous Days</div>${older.slice(0,4).map(u=>`<div class="ui" style="background:#F8F8FF;border-left-color:#D1D5DB"><div style="display:flex;justify-content:space-between"><span style="font-weight:700">${u.who}</span><span style="font-size:10px;color:#9CA3AF">${u.date} ${u.time}</span></div><div style="font-size:13px;color:#374151;margin-top:4px">${u.text}</div></div>`).join('')}</div>`:''}  </div></div></div>`;}
function sbDly(){const t=document.getElementById('di')?.value.trim();if(!t){alert('Please write your update.');return;}const now=new Date();S.daily.unshift({id:S.nid.daily++,who:S.user,text:t,date:'2026-07-04',time:now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),eh:[]});render();}
function mED(id){const u=S.daily.find(x=>x.id===id);if(!u)return;sm(`<div class="mot">✏️ Edit Daily Update</div><div class="eh" style="margin-bottom:12px">Original: "${u.text}"</div><div class="fg"><label class="fl">Updated text</label><textarea class="fi" id="edu-t" rows="3">${u.text}</textarea></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbED(${id})">Save Edit</button></div>`);}
function sbED(id){const u=S.daily.find(x=>x.id===id);const t=document.getElementById('edu-t')?.value.trim();if(!t||!u)return;u.eh.push({prev:u.text,at:new Date().toISOString()});u.text=t;hm();render();}
function rChat(){const ch=S.chs.find(c=>c.id===S.selCh)||S.chs[0];const msgs=(ch?.msgs||[]).filter(m=>!S.mentOnly||m.tags.includes(S.user));return`<div class="cl"><div class="csb"><div class="csbt">Channels</div>${S.chs.map(c=>`<div class="chi${c.id===S.selCh?' on':''}" onclick="S.selCh=${c.id};S.mentOnly=false;S.showEP=false;render()"># ${c.name}<div style="font-size:10px;color:#374151">${c.members.length} members</div></div>`).join('')}<div class="chi" onclick="mACh()" style="color:#F97316;border:1px dashed #F97316;margin-top:8px">+ New Channel</div><div class="csbt" style="margin-top:16px">My Activity</div><div class="chi${S.mentOnly?' on':''}" onclick="S.mentOnly=!S.mentOnly;render()">@ My Mentions</div></div><div class="cm"><div class="cmh"><div><div style="font-weight:700;font-size:14px"># ${ch?.name||''}</div><div style="font-size:11px;color:#9CA3AF">${ch?.members.join(', ')||''}</div></div><button class="btn btng btnsm" onclick="mAMem(${ch?.id||0})">+ Add Member</button></div><div class="cml" id="chat-msgs">${S.mentOnly?`<div style="background:#EFF6FF;border:1px solid #BFDBFE;border-radius:8px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:#1E40AF">Showing @${S.user} mentions</div>`:''}${msgs.map(m=>{const rx=Object.entries(m.rx||{});const txt=m.text.replace(/@(\w+)/g,'<span class="men">@$1</span>');return`<div class="mi"><div class="mav" style="background:${avcol(m.from)};width:30px;height:30px;font-size:10px">${ini(m.from)}</div><div style="flex:1;min-width:0"><div style="margin-bottom:2px"><span style="font-weight:700;font-size:12px">${m.from}</span><span style="font-size:10px;color:#9CA3AF;margin-left:6px">${m.date} ${m.time}</span></div><div class="mtx">${txt}</div><div class="mrs">${rx.map(([em,us])=>`<button class="rb${us.includes(S.user)?' on':''}" onclick="rxT(${ch.id},${m.id},'${em}')">${em} ${us.length}</button>`).join('')}<button class="rb" onclick="showRP(${ch.id},${m.id})" style="border:1px dashed #D1D5DB;color:#9CA3AF">+ React</button></div><div id="rp${m.id}" style="display:none;flex-wrap:wrap;gap:3px;padding:6px;background:#F9FAFB;border-radius:8px;margin-top:4px;max-width:250px">${EMOJIS.map(em=>`<button style="background:none;border:none;font-size:16px;cursor:pointer;padding:3px;border-radius:3px" onclick="rxT(${ch.id},${m.id},'${em}');document.getElementById('rp${m.id}').style.display='none'">${em}</button>`).join('')}</div></div></div>`;}).join('')||`<div style="text-align:center;color:#9CA3AF;padding:40px;font-size:13px">Start the conversation! 👋</div>`}</div><div class="cia">${S.showEP?`<div class="ep">${EMOJIS.map(em=>`<button class="eb" onclick="injEmoji(${ch?.id||0},'${em}')">${em}</button>`).join('')}</div>`:''}<div style="display:flex;gap:8px"><button class="btn btng btnsm" onclick="S.showEP=!S.showEP;render()" style="font-size:17px;padding:5px 10px">😊</button><textarea class="cin" id="ci${ch?.id||0}" placeholder="Message #${ch?.name||''}... use @Name to mention" rows="1" style="flex:1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sndMsg(${ch?.id||0})}"></textarea><button class="btn btnp btnsm" onclick="sndMsg(${ch?.id||0})">Send</button></div></div></div></div>`;}
function showRP(chId,msgId){const el=document.getElementById('rp'+msgId);if(el)el.style.display=el.style.display==='none'?'flex':'none';}
function rxT(chId,msgId,em){const ch=S.chs.find(c=>c.id===chId);const m=ch?.msgs.find(x=>x.id===msgId);if(!m)return;if(!m.rx[em])m.rx[em]=[];const i=m.rx[em].indexOf(S.user);if(i>-1)m.rx[em].splice(i,1);else m.rx[em].push(S.user);if(!m.rx[em].length)delete m.rx[em];render();}
function sndMsg(chId){const inp=document.getElementById('ci'+chId);const txt=inp?.value.trim();if(!txt)return;const ch=S.chs.find(c=>c.id===chId);if(!ch)return;const tags=[...txt.matchAll(/@(\w+)/g)].map(m=>m[1]);const now=new Date();ch.msgs.push({id:S.nid.msg++,from:S.user,text:txt,time:now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'}),date:'Jul 4',rx:{},tags});if(inp)inp.value='';S.showEP=false;render();}
function injEmoji(chId,em){const inp=document.getElementById('ci'+chId);if(inp){inp.value+=em;inp.focus();}S.showEP=false;render();}
function mACh(){sm(`<div class="mot">💬 New Channel</div><div class="fg"><label class="fl">Channel Name *</label><input class="fi" id="ch-nm" placeholder="e.g. project-name or weekly-sync"></div><div class="fg"><label class="fl">Members</label>${USERS.map((u,i)=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px"><input type="checkbox" id="chm-${i}" ${u===S.user?'checked disabled':''}> ${u}</label>`).join('')}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbACh()">Create Channel</button></div>`);}
function sbACh(){const nm=document.getElementById('ch-nm')?.value.trim().toLowerCase().replace(/\s+/g,'-');if(!nm){alert('Channel name required');return;}const mem=USERS.filter((u,i)=>document.getElementById('chm-'+i)?.checked||u===S.user);S.chs.push({id:S.nid.ch++,name:nm,members:mem,msgs:[]});S.selCh=S.chs[S.chs.length-1].id;hm();render();}
function mAMem(chId){const ch=S.chs.find(c=>c.id===chId);if(!ch)return;const av=USERS.filter(u=>!ch.members.includes(u));sm(`<div class="mot">➕ Add to #${ch.name}</div>${av.length?av.map((u,i)=>`<label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:8px"><input type="checkbox" id="nm-${i}"> ${u}</label>`).join(''):'<div style="color:#9CA3AF;font-size:13px">All users already members.</div>'}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbAMem(${chId})">Add</button></div>`);}
function sbAMem(chId){const ch=S.chs.find(c=>c.id===chId);const av=USERS.filter(u=>!ch.members.includes(u));av.forEach((u,i)=>{if(document.getElementById('nm-'+i)?.checked)ch.members.push(u);});hm();render();}
function filtMaster(){if(S.trkFilt==='monthly')return S.MASTER.filter(m=>m.date&&m.date.startsWith(S.trkMon));if(S.trkFilt==='fy')return S.MASTER.filter(m=>m.date&&m.date>='2026-04-01'&&m.date<='2027-03-31');return S.MASTER;}
function filtLedger(){if(S.ledFilt==='monthly')return S.LEDGER.filter(l=>l.date&&l.date.startsWith(S.ledMon));if(S.ledFilt==='fy')return S.LEDGER.filter(l=>l.date&&l.date>='2026-04-01'&&l.date<='2027-03-31');return S.LEDGER;}
function rFin(){return`<div class="tabs"><button class="tab${S.finTab==='tracker'?' on':''}" onclick="S.finTab='tracker';render()">📊 Project Tracker</button><button class="tab${S.finTab==='ledger'?' on':''}" onclick="S.finTab='ledger';render()">📒 Payment Ledger</button></div>${S.finTab==='tracker'?rTracker():rLedger()}`;}
function rTracker(){const rows=filtMaster();const totVal=rows.reduce((s,r)=>s+r.val,0);const totGst=rows.reduce((s,r)=>s+r.gst,0);const totTot=rows.reduce((s,r)=>s+r.tot,0);const paid=rows.filter(r=>r.pay==='Paid').reduce((s,r)=>s+r.tot,0);return`<div class="filt-bar"><div style="font-weight:600;font-size:12px;color:#374151;margin-right:4px">Filter:</div><button class="tab${S.trkFilt==='all'?' on':''} btnsm" onclick="S.trkFilt='all';render()">All</button><button class="tab${S.trkFilt==='monthly'?' on':''} btnsm" onclick="S.trkFilt='monthly';render()">Monthly</button><button class="tab${S.trkFilt==='fy'?' on':''} btnsm" onclick="S.trkFilt='fy';render()">FY 26-27</button>${S.trkFilt==='monthly'?`<select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.trkMon=this.value;render()">${MONTHS.map(m=>`<option value="${m.v}"${m.v===S.trkMon?' selected':''}>${m.l}</option>`).join('')}</select>`:''}${S.trkFilt==='fy'?`<span style="font-size:11px;color:#9CA3AF">Apr 2026 – Mar 2027</span>`:''}<div style="margin-left:auto"><button class="btn btnp btnsm" onclick="mAddMaster()">+ Add Entry</button></div></div><div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">${[{lb:'Project Value',v:fmt(totVal),ic:'💼'},{lb:'GST (18%)',v:fmt(totGst),ic:'🏛️'},{lb:'Total Invoiced',v:fmt(totTot),ic:'📄'},{lb:'Collected',v:fmt(paid),ic:'✅'}].map(m=>`<div style="flex:1;min-width:120px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-size:18px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin:3px 0;color:#111827">${m.v}</div><div style="font-size:11px;color:#9CA3AF">${m.lb}</div></div>`).join('')}</div><div class="tbl"><table><tr><th>Brand</th><th>Project</th><th>Client POC</th><th>Int. POC</th><th>Status</th><th>Project Value</th><th>GST (18%)</th><th>Total</th><th>PO Raised</th><th>Invoice</th><th>Payment</th><th>Date</th><th>Action</th></tr>${rows.map((r,i)=>`<tr style="background:${i%2===0?'#FAFAFA':'#fff'}"><td style="font-weight:700">${r.brand}</td><td style="font-size:11px;white-space:normal;max-width:120px">${r.proj}</td><td>${r.cpoc||'—'}</td><td>${r.ipoc||'—'}</td><td><span class="badge" style="background:${r.status==='Completed'?'#D1FAE5':r.status==='In Progress'?'#EFF6FF':'#F0FDF4'};color:${r.status==='Completed'?'#15803D':r.status==='In Progress'?'#1D4ED8':'#15803D'}">${r.status}</span></td><td style="text-align:right;font-weight:700">${fmt(r.val)}</td><td style="text-align:right">${fmt(r.gst)}</td><td style="text-align:right;font-weight:700;color:#7C3AED">${fmt(r.tot)}</td><td><span class="badge" style="background:${r.po==='Yes'?'#D1FAE5':'#F3F4F6'};color:${r.po==='Yes'?'#15803D':'#6B7280'}">${r.po}</span></td><td><span class="badge" style="background:${r.inv==='Raised'?'#D1FAE5':'#FEF3C7'};color:${r.inv==='Raised'?'#15803D':'#92400E'}">${r.inv}</span></td><td><span class="badge" style="background:${r.pay==='Paid'?'#D1FAE5':r.pay==='Advance Paid'?'#FEF3C7':'#FEE2E2'};color:${r.pay==='Paid'?'#15803D':r.pay==='Advance Paid'?'#92400E':'#BE123C'}">${r.pay}</span></td><td style="font-size:11px">${r.date}</td><td><button class="btn btng btnsm" onclick="mEditMaster(${r.id})">✏️</button></td></tr>`).join('')}<tr style="background:#0F1729;color:#fff"><td colspan="5" style="padding:9px 11px;font-weight:700">TOTAL (${rows.length} projects)</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totVal)}</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totGst)}</td><td style="padding:9px 11px;text-align:right;font-weight:700">${fmt(totTot)}</td><td colspan="5" style="padding:9px 11px;text-align:right">${fmt(paid)} collected</td></tr></table></div>`;}
function rLedger(){const rows=filtLedger();const totOut=rows.reduce((s,l)=>{const c=calcL(l);return s+c.tot;},0);const totYtc=rows.reduce((s,l)=>{const c=calcL(l);return s+c.ytc;},0);const totClr=rows.reduce((s,l)=>{const c=calcL(l);return s+(l.pay==='Cleared'?c.tot:0);},0);return`<div class="filt-bar"><div style="font-weight:600;font-size:12px;color:#374151;margin-right:4px">Filter:</div><button class="tab${S.ledFilt==='all'?' on':''} btnsm" onclick="S.ledFilt='all';render()">All</button><button class="tab${S.ledFilt==='monthly'?' on':''} btnsm" onclick="S.ledFilt='monthly';render()">Monthly</button><button class="tab${S.ledFilt==='fy'?' on':''} btnsm" onclick="S.ledFilt='fy';render()">FY 26-27</button>${S.ledFilt==='monthly'?`<select class="fi" style="width:auto;padding:4px 8px;font-size:11px" onchange="S.ledMon=this.value;render()">${MONTHS.map(m=>`<option value="${m.v}"${m.v===S.ledMon?' selected':''}>${m.l}</option>`).join('')}</select>`:''}<div style="margin-left:auto"><button class="btn btnp btnsm" onclick="mAddLedger()">+ Add Entry</button></div></div><div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">${[{lb:'Total Outgoing',v:fmt(totOut),ic:'📤'},{lb:'Cleared',v:fmt(totClr),ic:'✅'},{lb:'Pending',v:fmt(totYtc),ic:'⏳'},{lb:'Entries',v:rows.length,ic:'📋'}].map(m=>`<div style="flex:1;min-width:110px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)"><div style="font-size:18px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin:3px 0;color:#111827">${m.v}</div><div style="font-size:11px;color:#9CA3AF">${m.lb}</div></div>`).join('')}</div><div class="tbl"><table><tr><th>Name</th><th>Project</th><th>Amount</th><th>Tax%</th><th>Tax Amt</th><th>Total</th><th>TDS%</th><th>TDS Amt</th><th>After TDS</th><th>Invoice</th><th>Payment</th><th>Yet to Clear</th><th>Date</th><th>Remarks</th><th>Action</th></tr>${rows.map((l,i)=>{const c=calcL(l);return`<tr style="background:${l.pay==='Cleared'?'#F0FDF4':i%2===0?' function mAddLedger(){const projOpts=S.MASTER.map(m=>`<option value="${m.proj}">${m.brand} — ${m.proj}</option>`).join('');sm(`<div class="mot">📒 Add Payment Entry</div><div class="fr"><div class="fg"><label class="fl">Name (Vendor/Cast/Crew) *</label><input class="fi" id="al-name"></div><div class="fg"><label class="fl">Project</label><select class="fi" id="al-proj"><option value="">— Select Project —</option>${projOpts}<option value="SSF">SSF / Other</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Amount (₹) *</label><input class="fi" id="al-amt" type="number" oninput="calcAlFields()"></div><div class="fg"><label class="fl">Tax %</label><select class="fi" id="al-tax" onchange="calcAlFields()"><option value="0">0%</option><option value="18">18%</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Tax Amount (auto)</label><input class="fi" id="al-ta" readonly style="background:#F3F4F6"></div><div class="fg"><label class="fl">Total (auto)</label><input class="fi" id="al-tot" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">TDS %</label><select class="fi" id="al-tds" onchange="calcAlFields()"><option value="0">0%</option><option value="1">1%</option><option value="2">2%</option><option value="10">10%</option></select></div><div class="fg"><label class="fl">After TDS (auto)</label><input class="fi" id="al-at" readonly style="background:#F3F4F6"></div></div><div class="fr"><div class="fg"><label class="fl">Invoice Status</label><select class="fi" id="al-inv"><option value="Yet to send">Yet to send</option><option value="Sent">Sent</option></select></div><div class="fg"><label class="fl">Payment Status</label><select class="fi" id="al-pay"><option value="Pending">Pending</option><option value="Cleared">Cleared</option></select></div></div><div class="fr"><div class="fg"><label class="fl">Date</label><input class="fi" id="al-date" type="date" value="${new Date().toISO function rRep(){syncMaster();const ac=S.cards.filter(c=>!c.del);const won=ac.filter(c=>['WON','WIP','CLOSED'].includes(c.status));const lost=ac.filter(c=>c.status==='LOST');const totLedOut=S.LEDGER.reduce((s,l)=>s+calcL(l).tot,0);const totLedYtc=S.LEDGER.reduce((s,l)=>s+calcL(l).ytc,0);const totRev=S.MASTER.reduce((s,m)=>s+m.tot,0);const totCollected=S.MASTER.filter(m=>m.pay==='Paid').reduce((s,m)=>s+m.tot,0);const totPending=S.MASTER.filter(m=>m.pay!=='Paid').reduce((s,m)=>s+m.tot,0);return`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><button class="btn btnp" onclick="xlAll()">⬇ Download All (Excel)</button><button class="btn btng" onclick="xlExp('crm')">CRM Sheet</button><button class="btn btng" onclick="xlExp('proj')">Project Tracker Sheet</button><button class="btn btng" onclick="xlExp('ledger')">Payment Ledger Sheet</button><button class="btn btng" onclick="xlExp('daily')">Daily Updates Sheet</button></div><div class="kpis">${[{lb:'Total Invoiced (incl. GST)',v:fmt(totRev),ic:'📄',c:'#7C3AED',bg:'#F5F3FF'},{lb:'Collected',v:fmt(totCollected),ic:'✅',c:'#15803D',bg:'#F0FDF4'},{lb:'Pending Collection',v:fmt(totPending),ic:'⏳',c:'#C2410C',bg:'#FFF7ED'},{lb:'Total Outgoing',v:fmt(totLedOut),ic:'💸',c:'#BE123C',bg:'#FFF1F2'},{lb:'Yet to Clear',v:fmt(totLedYtc),ic:'⚠️',c:'#92400E',bg:'#FFFBEB'}].map(m=>`<div class="kpi" style="background:${m.bg}"><div style="font-size:16px">${m.ic}</div><div style="font-size:17px;font-weight:700;margin-bottom:2px;color:${m.c}">${m.v}</div><div style="font-size:10px;opacity:.75;color:${m.c}">${m.lb}</div></div>`).join('')}</div><div class="g2"><div class="card"><div class="ct">💰 Project Value vs Status</div>${S.MASTER.map(m=>{const col=m.status==='Completed'?'#4ADE80':m.status==='In Progress'?'#60A5FA':'#FCD34D';return`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.brand}</span><span class="badge" style="background:${m.status==='Completed'?'#D1FAE5':m.status==='In Progress'?'#EFF6FF':'#F0FDF4'};color:${m.status==='Completed'?'#15803D':m.status==='In Progress'?'#1D4ED8':'#15803D'}">${m.status}</span></div><div class="pbar"><div class="pbar-fill" style="width:${(m.tot/Math.max(S.MASTER.reduce((s,x)=>Math.max(s,x.tot),0),1)*100).toFixed(0)}%;background:${col}"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#9CA3AF;margin-top:2px"><span>${m.proj} · ${fmt(m.val)} + GST ${fmt(m.gst)}</span><span style="color:${m.pay==='Paid'?'#15803D':'#9CA3AF'}">${m.pay}</span></div></div>`;}).join('')}</div><div><div class="card"><div class="ct">🎯 CRM Win / Loss</div>${[{lb:'Won + WIP + Closed',n:won.length,t:ac.length,c:'#4ADE80',cv:'#15803D',v:won.reduce((s,c)=>s+c.value,0)},{lb:'In Pipeline',n:ac.filter(c=>['ENQUIRIES','ESTIMATE SENT'].includes(c.status)).length,t:ac.length,c:'#818CF8',cv:'#4338CA',v:0},{lb:'Lost',n:lost.length,t:ac.length,c:'#FB7185',cv:'#BE123C',v:lost.reduce((s,c)=>s+c.value,0)}].map(m=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.lb}</span><span style="font-weight:700;color:${m.cv}">${Math.round(m.n/Math.max(1,m.t)*100)}% (${m.n})</span></div><div class="pbar" style="height:9px"><div class="pbar-fill" style="width:${Math.round(m.n/Math.max(1,m.t)*100)}%;background:${m.c}"></div></div>${m.v?`<div style="font-size:10px;color:#9CA3AF;margin-top:2px">Value: ${fmt(m.v)}</div>`:''}</div>`).join('')}<div style="margin-top:14px">${[['Total CRM Deals',ac.length],['Win Rate',Math.round(won.length/Math.max(1,ac.length)*100)+'%'],['Total Pipeline Value',fmt(ac.reduce((s,c)=>s+c.value,0))],['Archived',S.cards.filter(c=>c.arch).length]].map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#F8F8FF;border-radius:8px;margin-bottom:4px;font-size:12px"><span>${l}</span><span style="font-weight:700">${v}</span></div>`).join('')}</div></div><div class="card"><div class="ct">💳 Payment Status</div>${[{lb:'Collected (Paid)',v:totCollected,t:totRev,c:'#4ADE80'},{lb:'Not Yet Collected',v:totPending,t:totRev,c:'#FB7185'},{lb:'Outgoing Cleared',v:S.LEDGER.filter(l=>l.pay==='Cleared').reduce((s,l)=>s+calcL(l).tot,0),t:totLedOut,c:'#4ADE80'},{lb:'Outgoing Pending',v:totLedYtc,t:totLedOut,c:'#FB7185'}].map(m=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span style="font-weight:600">${m.lb}</span><span style="font-weight:700">${fmt(m.v)}</span></div><div class="pbar" style="height:9px"><div class="pbar-fill" style="width:${m.t?Math.round(m.v/m.t*100):0}%;background:${m.c}"></div></div></div>`).join('')}</div></div></div><div class="card"><div class="ct">👥 Team Workload</div><div class="g3">${USERS.map(u=>{const projs=S.projects.filter(p=>p.status==='WIP'&&[p.lead,p.lead2,p.prod,p.post,p.editor].includes(u));const c=projs.length>=3?'#FB7185':projs.length>=2?'#FCD34D':'#4ADE80';return`<div style="background:#F8F8FF;border-radius:9px;padding:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div class="mav" style="background:${avcol(u)};width:30px;height:30px;font-size:10px">${ini(u)}</div><div><div style="font-weight:600;font-size:12px">${u}</div><div style="font-size:10px;color:#9CA3AF">${projs.length} active projects</div></div></div><div class="pbar" style="height:8px"><div class="pbar-fill" style="width:${Math.min(projs.length/3*100,100)}%;background:${c}"></div></div>${projs.map(p=>`<div style="font-size:10px;color:#6B7280;margin-top:3px">· ${p.name}</div>`).join('')}</div>`;}).join('')}</div></div>`;}
function xlAll(){xlExp('all');}
function xlExp(type){if(!window.XLSX){alert('Excel library loading, try again.');return;}const wb=XLSX.utils.book_new();function add(d,n){if(d.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d),n);}if(type==='all'||type==='crm')add(S.cards.filter(c=>!c.del).map(c=>({Client:c.client,Project:c.project,Stage:c.status,Value:c.value,POC:c.poc,Reference:c.ref,Date:c.date,Archived:c.arch?'Yes':'No',Notes:c.notes})),'CRM Pipeline');if(type==='all'||type==='proj')add(S.MASTER.map(m=>({Brand:m.brand,Project:m.proj,'Client POC':m.cpoc,'Internal POC':m.ipoc,Status:m.status,'Project Value':m.val,'GST (18%)':m.gst,'Total (incl GST)':m.tot,'PO Raised':m.po,Invoice:m.inv,Payment:m.pay,Date:m.date})),'Project Tracker');if(type==='all'||type==='ledger')add(S.LEDGER.map(l=>{const c=calcL(l);return{Name:l.name,Project:l.proj,Amount:l.amt,'Tax%':l.taxPct+'%','Tax Amt':c.ta,Total:c.tot,'TDS%':l.tdsPct+'%','TDS Amt':c.tdsAmt,'After TDS':c.at,'Invoice Status':l.inv,'Payment Status':l.pay,'Yet to Clear':c.ytc,Date:l.date,Remarks:l.rem};}),'Payment Ledger');if(type==='all'||type==='daily')add(S.daily.map(u=>({Person:u.who,Update:u.text,Date:u.date,Time:u.time,'Edit Count':u.eh.length})),'Daily Updates');if(type==='all')add(S.projects.map(p=>({Client:p.client,Project:p.name,Type:p.type,Status:p.status,Lead:p.lead,Editor:p.editor,Producer:p.prod,Budget:p.budget,'Progress%':p.prog,'Start Date':p.start,'Close Date':p.close})),'Projects');XLSX.writeFile(wb,type==='all'?'SugarShot_Reports_Full.xlsx':`SugarShot_${type}.xlsx`);}
function rLv(){const myLv=S.leaves.filter(l=>l.who===S.user);const othersApproved=S.leaves.filter(l=>l.who!==S.user&&l.status==='Approved');const toShow=S.role==='partner'?S.leaves:[...myLv,...othersApproved];const pending=S.leaves.filter(l=>l.status==='Pending');const lc=st=>st==='Approved'?'#4ADE80':st==='Rejected'?'#FB7185':'#FCD34D';const lbg=st=>st==='Approved'?'#D1FAE5':st==='Rejected'?'#FEE2E2':'#FEF3C7';const ltx=st=>st==='Approved'?'#15803D':st==='Rejected'?'#BE123C':'#92400E';return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><div style="font-size:14px;font-weight:700;color:#111827">🌴 Leave Management</div><div style="font-size:12px;color:#9CA3AF;margin-top:2px">${S.role==='partner'?'Partner view — all team leaves visible':'Your leaves + approved team leaves'}</div></div><button class="btn btnp" onclick="mReqLv()">+ Request Leave</button></div>${S.role==='partner'&&pending.length?`<div style="background:#FEF3C7;border:1.5px solid #FCD34D;border-radius:10px;padding:12px 14px;margin-bottom:14px"><span style="font-size:13px;font-weight:600;color:#92400E">⏳ ${pending.length} leave request${pending.length>1?'s':''} pending your approval</span></div>`:''}${toShow.length===0?`<div class="es">No leaves to display</div>`:''}${toShow.map(l=>{const days=Math.round((new Date(l.to)-new Date(l.from))/86400000)+1;return`<div class="lv-card" style="border-left-color:${lc(l.status)}"><div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px"><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="mav" style="background:${avcol(l.who)};width:30px;height:30px;font-size:10px">${ini(l.who)}</div><span style="font-weight:700;font-size:14px">${l.who}</span></div><div style="font-size:12px;color:#374151;margin-left:38px"><strong>${l.type}</strong> · ${l.from}${l.from!==l.to?' → '+l.to:''} · <strong>${days} day${days>1?'s':''}</strong></div></div><span class="badge" style="background:${lbg(l.status)};color:${ltx(l.status)}">${l.status}</span></div><div style="font-size:13px;color:#6B7280;margin-left:38px">${l.reason}</div>${l.notes?`<div style="font-size:11px;color:#9CA3AF;margin-left:38px;margin-top:2px">Note: ${l.notes}</div>`:''}${l.approvedBy?`<div style="font-size:10px;color:#9CA3AF;margin-left:38px;margin-top:3px">✓ ${l.status} by ${l.approvedBy}</div>`:''}${l.status==='Pending'&&S.role==='partner'?`<div style="display:flex;gap:8px;margin-top:10px;margin-left:38px"><button class="btn btnok btnsm" onclick="appLv(${l.id})">✅ Approve</button><button class="btn btnd btnsm" onclick="rejLv(${l.id})">✕ Reject</button></div>`:''}  </div>`;}).join('')}`;}
function appLv(id){const l=S.leaves.find(x=>x.id===id);if(l){l.status='Approved';l.approvedBy=S.user;}render();}
function rejLv(id){const l=S.leaves.find(x=>x.id===id);if(l)l.status='Rejected';render();}
function mReqLv(){const isEmp=S.role==='employee';sm(`<div class="mot">🌴 Request Leave</div>${!isEmp?`<div class="fg"><label class="fl">Request For *</label><select class="fi" id="lv-who">${uopts(S.user)}</select></div>`:''}<div class="fg"><label class="fl">Leave Type *</label><select class="fi" id="lv-ty">${LTYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="fr"><div class="fg"><label class="fl">From Date *</label><input class="fi" id="lv-fr" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="fg"><label class="fl">To Date *</label><input class="fi" id="lv-to" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div><div class="fg"><label class="fl">Reason *</label><input class="fi" id="lv-rs" placeholder="e.g. Medical appointment, Family event..."></div><div class="fg"><label class="fl">Project Handover / Notes</label><textarea class="fi" id="lv-nt" rows="2" placeholder="Any project impact or handover notes?"></textarea></div><div style="background:#EFF6FF;border-radius:8px;padding:10px 12px;font-size:12px;color:#1E40AF;margin-bottom:12px">Info: Leave requires partner approval. Once approved, the team will be notified.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btng" onclick="hm()">Cancel</button><button class="btn btnp" onclick="sbLv(${isEmp})">Submit Request</button></div>`);}
function sbLv(isEmp){const fr=document.getElementById('lv-fr')?.value,to=document.getElementById('lv-to')?.value,rs=document.getElementById('lv-rs')?.value.trim();if(!fr||!to||!rs){alert('Fill all required fields.');return;}if(to<fr){alert('End date cannot be before start date.');return;}const days=Math.round((new Date(to)-new Date(fr))/86400000)+1;const who=isEmp?S.user:document.getElementById('lv-who')?.value||S.user;S.leaves.unshift({id:S.nid.lv++,who,type:document.getElementById('lv-ty')?.value||LTYPES[0],from:fr,to,days,reason:rs,status:'Pending',approvedBy:'',notes:document.getElementById('lv-nt')?.value||''});hm();render();}
function sm(html){document.getElementById('mc').innerHTML=html;document.getElementById('mov').className='mov on';}
function hm(){document.getElementById('mov').className='mov';}
function conf(){const el=document.getElementById('cf');el.style.display='block';el.innerHTML='';const colors=['#F97316','#FFD600','#4ADE80','#818CF8','#FB7185','#38BDF8'];for(let i=0;i<55;i++){const d=document.createElement('div');d.className='cp';d.style.cssText=`left:${Math.random()*100}%;top:-20px;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${colors[i%colors.length]};animation-delay:${Math.random()*0.5}s;animation-duration:${1.8+Math.random()*0.8}s`;el.appendChild(d);}setTimeout(()=>{el.style.display='none';el.innerHTML='';},3200);}
syncMaster();
// Role is chosen on the sign-in page and passed in as ?role=partner|employee.
const _r=new URLSearchParams(location.search).get('role');
setRole(_r==='employee'?'employee':'partner');
</script>
